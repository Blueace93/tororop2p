async function shrinkImg(file,max=1600,q=.85){
  try{if(!file||file.size<350*1024||!/^image\/(jpeg|png|webp)$/.test(file.type)||!window.createImageBitmap)return file;
    const bm=await createImageBitmap(file,{imageOrientation:'from-image'});
    const k=Math.min(1,max/Math.max(bm.width,bm.height)),w=Math.round(bm.width*k),h=Math.round(bm.height*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(bm,0,0,w,h);if(bm.close)bm.close();
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(!blob||blob.size>=file.size)return file;
    return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'foto')+'.jpg',{type:'image/jpeg'})
  }catch(e){return file}}

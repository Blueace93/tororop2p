  const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="md">${html}</div>`;
  m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function ask(title,body,ok='Confirmar',cls=''){
  return new Promise(res=>{
    const m=modal(`<h3>${title}</h3>${body}<div class="grid2" style="margin-top:12px"><button class="b gh" id="mn">Cancelar</button><button class="b ${cls}" id="my">${ok}</button></div>`);
    m.onclick=e=>{if(e.target===m){m.remove();res(null)}};
    m.querySelector('#mn').onclick=()=>{m.remove();res(null)};
    m.querySelector('#my').onclick=()=>res(m)})}
function zoom(src){const m=modal(`<img src="${esc(src)}" alt="Captura"><button class="b gh w" style="margin-top:10px">Cerrar</button>`);m.querySelector('button').onclick=()=>m.remove()}

/* ===== Parte completada. Nombres de tablas/columnas = SUPUESTOS: ajústalos en T si tu base es distinta ===== */
const T={profiles:'profiles',wallets:'wallets',settings:'settings',offers:'offers',orders:'orders',ann:'announcements'};
async function safe(p,d){try{const{data,error}=await p;if(error)throw error;return data??d}catch(e){console.warn(e);return d}}

async function loadAll(){
  const uid=S.user.id;
  const [p,w,st]=await Promise.all([
    safe(sb.from(T.profiles).select('*').eq('id',uid).maybeSingle(),null),
    safe(sb.from(T.wallets).select('*').eq('user_id',uid).maybeSingle(),null),
    safe(sb.from(T.settings).select('*'),[])]);
  S.profile=p||{username:(S.user.email||'usuario').split('@')[0]};
  S.wallet=w||{available:0};
  S.bal={CUP:Number(w?.cup)||0,USD:Number(w?.usd)||0,MOVIL:Number(w?.movil)||0};
  S.settings=Object.fromEntries((st||[]).map(r=>[r.key,r.value]));
  S.fees={trade:+S.settings.fee_percent||0,withdraw:+S.settings.withdraw_fee_percent||0};
  S.kycOff=String(S.settings.kyc_off)==='true'}

function authView(){
  const reg=S.authReg;
  $app.innerHTML=`<div class="auth"><div style="text-align:center;margin-bottom:18px">${brand(44)}</div>
  <div class="card"><div class="seg"><button class="${reg?'':'on'}" id="aL">Entrar</button><button class="${reg?'on':''}" id="aR">Registro</button></div>
  ${reg?'<label for="au">Usuario</label><input id="au" autocomplete="username">':''}
  <label for="ae">Correo</label><input id="ae" type="email" autocomplete="email">
  <label for="ap">Contraseña</label><input id="ap" type="password" autocomplete="${reg?'new-password':'current-password'}">
  <button class="b w" id="ago">${reg?'Crear cuenta':'Entrar'}</button></div></div>`;
  $('aL').onclick=()=>{S.authReg=false;authView()};$('aR').onclick=()=>{S.authReg=true;authView()};
  $('ago').onclick=e=>act(e.target,async()=>{
    const email=$('ae').value.trim(),password=$('ap').value;
    if(!email||!password)throw new Error('Completa correo y contraseña');
    if(reg){const username=$('au').value.trim();if(!username)throw new Error('Escribe un usuario');
      const{data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;
      if(!data.session)toast('Cuenta creada. Revisa tu correo para confirmarla','good')}
    else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}})}

function shell(){
  const tabs=[['market','Mercado'],['orders','Órdenes'],['wallet','Billetera'],['profile','Perfil']];
  if(S.profile?.is_admin)tabs.push(['admin','Admin']);
  $app.innerHTML=`<header>${brand(28)}<div class="hr"><button class="ib" id="bell" aria-label="Notificaciones">${IC.bell}</button><button class="ib" id="hav" aria-label="Perfil">${avatar(26)}</button></div></header>
  <main id="main"></main>
  <nav>${tabs.map(([k,l])=>`<button data-v="${k}" class="${S.view===k?'on':''}">${IC[k]}${l}</button>`).join('')}</nav>
  <a class="wa" href="https://wa.me/${esc(CFG.whatsapp)}" target="_blank" rel="noopener">Soporte</a>`;
  document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('hav').onclick=()=>go('profile');$('bell').onclick=()=>go('ann');updBell()}

function go(v){S.view=v;render()}
function render(){
  if(!S.user){authView();return}
  if(!$('main'))shell();
  document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  ({market:vMarket,orders:vOrders,wallet:vWallet,profile:vProfile,ann:vAnn,info:vInfo,admin:vAdmin}[S.view]||vMarket)()}

async function vMarket(){
  const mk=S.mk||'ads';
  main().innerHTML=topHtml()+`<input id="q" placeholder="Buscar" value="${esc(S.f.q)}"><div id="list">${skel(3)}</div>`;bindTop();
  const rows=await safe(sb.from(T.offers).select('*').eq('status','open').order('price_cup',{ascending:S.f.sort==='asc'}),[]);
  if(S.view!=='market')return;
  const draw=()=>{const q=S.f.q.toLowerCase();
    const l=rows.filter(o=>(mk==='ads'||o.asset===(mk==='usdt'?'USDT':'USD'))&&(!q||JSON.stringify(o).toLowerCase().includes(q)));
    $('list').innerHTML=l.length?l.map(o=>`<div class="card"><div class="row"><b>${esc(ASSETS[o.asset]?.label||o.asset)}</b><span class="tag ${o.side==='sell'?'warn':'ok'}">${o.side==='sell'?'Vende':'Compra'}</span></div>
      <div class="big">${n(o.price_cup,0)} <span class="mut">CUP</span></div>
      <div class="mut">Cantidad: ${n(o.amount,qd(o.asset))} · ${esc(parseM(o.payment_method).m)}</div></div>`).join(''):'<div class="card mut">No hay ofertas por ahora.</div>'};
  draw();$('q').oninput=e=>{S.f.q=e.target.value;draw()}}

async function vOrders(){
  main().innerHTML=`<h2>Mis órdenes</h2>${skel(3)}`;
  const uid=S.user.id;
  const rows=await safe(sb.from(T.orders).select('*').or(`buyer_id.eq.${uid},seller_id.eq.${uid}`).order('created_at',{ascending:false}),[]);
  if(S.view!=='orders')return;
  main().innerHTML=`<h2>Mis órdenes</h2>`+(rows.length?rows.map(o=>{const s=STATUS[o.status]||[o.status,''];
    return`<div class="card"><div class="row"><b>${n(o.amount,2)} ${esc(o.asset||'')}</b><span class="tag ${s[1]}">${esc(s[0])}</span></div>
    <div class="mut">${n(o.total_cup,0)} CUP · ${esc(when(o.created_at))}</div></div>`}).join(''):'<div class="card mut">Aún no tienes órdenes.</div>')}

function vWallet(){
  main().innerHTML=`<h2>Billetera</h2><div class="wts">${wtile('USDT',S.wallet?.available,'Tether',2)}${wtile('Saldo CUP',S.bal.CUP,'CUP',0)}${wtile('Saldo Clásica',S.bal.USD,'USD',2)}</div>
  <h3 style="margin-top:18px">Depositar</h3>
  <div class="card"><div class="mut">Tarjeta CUP</div><div class="row"><code>${esc(CFG.card)}</code>${cpBtn(CFG.card)}</div>
  <div class="mut" style="margin-top:10px">Tarjeta USD (Clásica)</div><div class="row"><code>${esc(CFG.card_usd)}</code>${cpBtn(CFG.card_usd)}</div>
  <p class="mut">Tras transferir, escribe a soporte por WhatsApp con tu comprobante.</p></div>`}

function vProfile(){
  const p=S.profile||{},st={approved:['Verificado','ok'],pending:['En revisión','warn'],rejected:['Rechazado','bad']}[p.kyc_status]||['Sin verificar',''];
  main().innerHTML=`<h2>Perfil</h2>${kycBanner()}<div class="card"><div class="row"><div class="lg">${avatar(44)}<div><b>${esc(p.username)}</b><div class="mut">${esc(S.user.email)}</div></div></div><span class="tag ${st[1]}">${st[0]}</span></div></div>
  <button class="b bad w" id="out">Cerrar sesión</button>`;
  $('out').onclick=()=>sb.auth.signOut()}

async function vAnn(){
  main().innerHTML=`<h2>Anuncios</h2>${skel(2)}`;
  const rows=await safe(sb.from(T.ann).select('*').order('created_at',{ascending:false}).limit(30),[]);
  if(S.view!=='ann')return;
  main().innerHTML=`<h2>Anuncios</h2>`+(rows.length?rows.map(a=>`<div class="card nt"><b>${esc(a.title)}</b><div class="pre">${esc(a.body)}</div><div class="mut">${esc(when(a.created_at))}</div></div>`).join(''):'<div class="card mut">No hay anuncios.</div>');
  S.annNew=false;updAnn()}

function vInfo(){
  main().innerHTML=`<h2>Información</h2><div class="card"><p>${esc(APP_NAME)} P2P: compra y vende USDT y saldo en CUP entre usuarios.</p>
  <p class="mut">Comisión de operación: ${S.fees.trade}% · Retiros: ${S.fees.withdraw}%</p><p class="mut">Soporte por WhatsApp: +${esc(CFG.whatsapp)}</p></div>`}

async function vAdmin(){
  if(!S.profile?.is_admin){go('market');return}
  main().innerHTML=`<h2>Administración</h2>${skel(2)}`;
  const rows=await safe(sb.from(T.orders).select('*').in('status',['seller_confirmed','disputed']).order('created_at',{ascending:false}),[]);
  if(S.view!=='admin')return;
  S.adminPend=rows.length;updBell();
  main().innerHTML=`<h2>Administración</h2>`+(rows.length?rows.map(o=>`<div class="card ${o.status==='disputed'?'dg':'hl'}"><div class="row"><b>${n(o.amount,2)} ${esc(o.asset||'')}</b><span class="tag ${STATUS[o.status][1]}">${esc(STATUS[o.status][0])}</span></div><div class="mut">${esc(when(o.created_at))}</div></div>`).join(''):'<div class="card mut">Nada pendiente de revisión.</div>')}

/* ===== Arranque ===== */
async function boot(session){
  S.user=session?.user||null;
  if(S.user){await loadAll();S.view=S.view||'market'}else{S.profile=null}
  $app.innerHTML='';render()}
$app.innerHTML=`<div class="auth">${skel(2)}</div>`;
sb.auth.getSession().then(({data})=>boot(data.session));
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){sb.auth.getSession().then(({data})=>boot(data.session))}});
</script>
</body>
</html>

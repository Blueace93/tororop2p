<script>
/* Iconos por temporada (favicon, icono de iPhone, avisos y color del logo dentro de la app).
   Para cambiar fechas edita ICON_TEMPORADAS: formato MM-DD, ambos días incluidos; puede cruzar el fin de año (12-01 a 01-06).
   Si no hay temporada activa se usa ic-oscuro o ic-claro según el tema. Mantén la misma tabla en sw.js. */
window.ICON_TEMPORADAS=[{icono:'dorado',desde:'12-31',hasta:'01-01'},{icono:'festivo',desde:'12-01',hasta:'01-06'}]; /* gana la primera que coincida: el dorado (Año Nuevo) va antes que el festivo */
window.iconoActual=function(){try{
  var d=new Date(),k=('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  for(var i=0;i<ICON_TEMPORADAS.length;i++){var t=ICON_TEMPORADAS[i],ok=t.desde<=t.hasta?(k>=t.desde&&k<=t.hasta):(k>=t.desde||k<=t.hasta);if(ok)return t.icono}
  }catch(e){}
  return document.documentElement.getAttribute('data-theme')==='dark'?'oscuro':'claro'};
window.iconoUrl=function(){return 'ic-'+iconoActual()+'-192.png'};
window.iconoApply=function(){try{var u=iconoUrl(),a=document.getElementById('fav'),b=document.getElementById('ati');if(a)a.href=u;if(b)b.href=u;
  var s=document.querySelectorAll('#lgG stop'),f=iconoActual()==='festivo';
  if(s.length===2){s[0].setAttribute('stop-color',f?'#f05252':'#8b7cff');s[1].setAttribute('stop-color',f?'#c81e1e':'#4f8dff')}}catch(e){}};
iconoApply();document.addEventListener('DOMContentLoaded',iconoApply);
</script>

header,nav,#toast,.ov,.fab-bg,.wal-a,.wal-c{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
header{background:#0b0e11!important}nav{background:#12141f!important}.ov{background:rgba(3,4,10,.82)!important}.fab-bg{background:rgba(3,4,10,.8)!important}#toast{background:#0e0f18!important}
main>*{animation-duration:.2s!important}
main>*:nth-child(n+9){animation:none!important}
.card,.tile{will-change:auto}
html.lite *,html.lite *:before,html.lite *:after{animation:none!important;transition:none!important}
html.lite .sk{background:var(--card)!important}
#netbar{position:fixed;left:0;right:0;top:0;z-index:99;background:#7a2b25;color:#fff;text-align:center;font-size:13px;padding:6px 10px calc(6px + env(safe-area-inset-top,0px)*0);display:none}
.gd{text-align:center;max-height:64dvh;overflow-y:auto}
.gd-bar{display:flex;gap:6px;justify-content:center;margin:0 0 16px}.gd-bar i{height:5px;width:18px;border-radius:5px;background:var(--line)}.gd-bar i.on{width:30px;background:linear-gradient(90deg,var(--acc,#6f6bff),var(--acc2,#2bb6ff))}
.gd-ic{width:72px;height:72px;margin:0 auto 12px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#6f6bff,#2bb6ff);color:#fff;box-shadow:0 14px 28px -14px rgba(79,141,255,.9)}.gd-ic svg{width:34px;height:34px}
.gd h3{font-size:20px;margin:4px 0 6px}.gd p{margin:0 0 10px}

@keyframes gdUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes gdPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes gdRing{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes gdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.gd>*{animation:gdUp .5s both}.gd>*:nth-child(2){animation-delay:.08s}.gd>*:nth-child(3){animation-delay:.16s}.gd>*:nth-child(4){animation-delay:.24s}.gd>*:nth-child(5){animation-delay:.32s}.gd>*:nth-child(6){animation-delay:.4s}.gd>*:nth-child(7){animation-delay:.48s}
.gd-hero{position:relative;width:110px;height:110px;margin:6px auto 16px;display:grid;place-items:center}
.gd-hero i{position:absolute;inset:0;border-radius:50%;border:2px solid #2ee6a6;animation:gdRing 2.4s infinite}.gd-hero i:nth-child(2){animation-delay:.8s}.gd-hero i:nth-child(3){animation-delay:1.6s}
.gd-hero .gd-ic{margin:0;width:84px;height:84px;animation:gdPop .7s both,gdFloat 3s 1s infinite}.gd-hero .gd-ic svg{width:42px;height:42px}
.gd-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.gd-stats div{background:rgba(46,230,166,.10);border:1px solid rgba(46,230,166,.3);border-radius:14px;padding:12px 6px}.gd-stats b{display:block;font-size:26px;color:#2ee6a6}.gd-stats span{font-size:12px;opacity:.8}
.gd-flow{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:16px 0 8px}.gd-n{flex:1;border-radius:16px;padding:12px 4px;background:rgba(111,107,255,.14);border:1px solid var(--line);transition:.4s;opacity:.45;transform:scale(.94)}.gd-n.on{opacity:1;transform:scale(1.04);background:rgba(46,230,166,.16);border-color:#2ee6a6}.gd-n em{display:block;font-style:normal;font-size:26px}.gd-n small{font-size:11px}
.gd-ar{opacity:.4;transition:.4s}.gd-ar.on{opacity:1;color:#2ee6a6}
.gd-cap{min-height:58px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:14px;line-height:1.4;transition:opacity .3s}
.gd-q{display:flex;flex-direction:column;gap:8px;margin:12px 0}.gd-q button{text-align:left;border:1px solid var(--line);background:rgba(111,107,255,.12);color:inherit;border-radius:14px;padding:12px;font:inherit;cursor:pointer;transition:.25s}.gd-q button.on{border-color:#2ee6a6;background:rgba(46,230,166,.12)}.gd-q button .a{display:none;margin-top:8px;font-size:13px;opacity:.9;line-height:1.4}.gd-q button.on .a{display:block;animation:gdUp .35s both}
.gd-chk .gd-li{opacity:0;transform:translateX(-12px);transition:.45s}.gd-chk .gd-li.sh{opacity:1;transform:none}
html.lite .gd>*,html.lite .gd-hero i,html.lite .gd-hero .gd-ic{animation:none!important}html.lite .ov{backdrop-filter:none!important}html.lite .gd-n,html.lite .gd-chk .gd-li{transition:none}
@media (prefers-reduced-motion:reduce){.gd>*,.gd-hero i,.gd-hero .gd-ic{animation:none!important}}
.gd-coins{display:flex;gap:12px;justify-content:center;margin:14px 0 6px}
.gd-li{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 0;border-top:1px solid var(--line)}.gd-li:first-of-type{border-top:0}
.gd-li .gd-s{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(111,107,255,.18);color:#b9b4ff}.gd-li .gd-s svg{width:21px;height:21px}
.gd-li.ok .gd-s{background:rgba(46,230,166,.14);color:#2ee6a6}
.gd-li b{display:block;margin-bottom:2px}.gd-li .mut{font-size:13px;line-height:1.35}
/* Panel admin: pestañas y rendimiento */
.atabs{display:flex!important;flex-wrap:nowrap!important;gap:8px;overflow-x:auto;margin:4px 0 14px;scrollbar-width:none}.atabs::-webkit-scrollbar{display:none}.atabs .chip{flex:none;white-space:nowrap}
main.adm>*{animation:none!important}
main.adm .card:not(.hl){content-visibility:auto;contain-intrinsic-size:auto 120px}
main[data-atab="pend"]>[data-tab]:not([data-tab="pend"]):not([data-tab="all"]),main[data-atab="usr"]>[data-tab]:not([data-tab="usr"]):not([data-tab="all"]),main[data-atab="mny"]>[data-tab]:not([data-tab="mny"]):not([data-tab="all"]),main[data-atab="cfg"]>[data-tab]:not([data-tab="cfg"]):not([data-tab="all"]),main[data-atab="sta"]>[data-tab]:not([data-tab="sta"]):not([data-tab="all"]),main[data-atab="stf"]>[data-tab]:not([data-tab="stf"]):not([data-tab="all"]){display:none!important}
/* Pulido visual del inicio: solo estilos estáticos (sin desenfoques ni animaciones nuevas, para no gastar rendimiento) */
.hi{font-size:20px;font-weight:500;margin:4px 2px 14px;letter-spacing:-.2px}
.hi b{font-weight:800;color:#c9c3ff}
.wal{box-shadow:0 18px 40px -22px rgba(91,69,255,.75),inset 0 1px 0 rgba(255,255,255,.18)}
.wal-b{font-size:38px}
#auC{background:linear-gradient(90deg,rgba(61,220,151,.15),rgba(61,220,151,.03))!important;border-color:rgba(61,220,151,.3)!important;border-radius:99px!important;padding:8px 16px!important}
#auC:after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.22)}
.chips .chip[data-mk]{padding:8px 14px;font-weight:600}
.chips .chip[data-mk].on{background:var(--g);border-color:transparent;color:#fff;font-weight:700}
.tile{font-size:12.5px;letter-spacing:.1px}
#adl>.card{border-radius:22px;padding:16px;border-color:rgba(255,255,255,.07);box-shadow:0 10px 24px -18px #000}
#adl>.card:has(.tag.ok){box-shadow:inset 3px 0 0 var(--ok),0 10px 24px -18px #000}
#adl>.card:has(.tag.warn){box-shadow:inset 3px 0 0 var(--warn),0 10px 24px -18px #000}
#adl .tag{font-weight:700}
/* Respuesta táctil inmediata */
button.b,.chip,.tile,.qb,nav button,.seg button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button.b:active,.chip:active,.tile:active,.qb:active,.seg button:active{filter:brightness(.82)}
nav button:active{opacity:.7}
/* En Billetera los botones flotantes tapaban los botones de retiro/recarga */
body[data-view="wallet"] .fab,body[data-view="wallet"] .fab-bg,body[data-view="wallet"] .up{display:none!important}
#mnt{position:fixed;inset:0;z-index:9999;background:radial-gradient(120% 55% at 50% -8%,#2b2713 0%,rgba(9,10,16,0) 60%) no-repeat,#0b0e11;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
#mnt .mnt-c{max-width:420px;width:100%}#mnt .mnt-i{font-size:56px;margin-bottom:8px}
#mnt h1{font-size:24px;letter-spacing:-.3px;margin:0 0 10px;line-height:1.2}#mnt .mnt-m{margin:0 0 14px}
#mnt .mnt-w{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 16px}
#mnt .mnt-w b{display:block;font-size:17px;margin:2px 0 6px;text-transform:capitalize}#mnt a{display:inline-block;margin-top:16px;font-size:12px}
#mntb{position:fixed;top:0;left:0;right:0;z-index:98;background:#7a2b25;color:#fff;text-align:center;font-size:11px;padding:2px 8px;pointer-events:none}


/* ---- anuncio a pantalla completa (se puede cerrar) ---- */
#annf{position:fixed;inset:0;z-index:9000;background:radial-gradient(120% 55% at 50% -8%,#2b2713 0%,rgba(9,10,16,0) 60%) no-repeat,#0b0e11;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto;animation:vin .25s ease-out}
#annf .af-c{max-width:440px;width:100%}#annf .af-i{font-size:54px;margin-bottom:6px;display:inline-block;animation:axf 3s ease-in-out infinite}
#annf h1{font-size:24px;line-height:1.2;margin:0 0 12px;letter-spacing:-.3px}
#annf .af-b{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 16px;text-align:left;white-space:pre-wrap;word-break:break-word;max-height:42dvh;overflow:auto}
#annf .af-d{display:inline-block;margin:0 0 12px}#annf .af-n{font-size:12px;opacity:.7;margin:10px 0 0}
#annf .af-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit;font-size:18px;cursor:pointer}
html.lite #annf,html.lite #annf .af-i{animation:none}

/* ===== Acceso compacto ===== */
/* El modo ahorro apaga todo, pero el login mantiene sus animaciones (solo mueven transform/opacity: son baratas) */
html.lite .auth .axc{animation-name:axf!important;animation-duration:3.4s!important;animation-timing-function:ease-in-out!important;animation-iteration-count:infinite!important}
html.lite .auth .axc+.axl+.axc{animation-delay:-1.7s!important}
html.lite .auth .axc:before{animation-name:axr!important;animation-duration:2.6s!important;animation-iteration-count:infinite!important}
html.lite .auth .axl i{animation-name:axd!important;animation-duration:2.4s!important;animation-timing-function:linear!important;animation-iteration-count:infinite!important}
html.lite .auth .axl i:nth-child(2){animation-delay:.8s!important}html.lite .auth .axl i:nth-child(3){animation-delay:1.6s!important}
html.lite .auth .axb span{animation-name:axs!important;animation-duration:7s!important;animation-timing-function:ease-in-out!important;animation-iteration-count:infinite!important}
html.lite .auth .axb span:nth-child(2){animation-delay:-2s!important}html.lite .auth .axb span:nth-child(3){animation-delay:-4s!important}html.lite .auth .axb span:nth-child(4){animation-delay:-1s!important}
html.lite .auth:before{animation-name:float!important;animation-duration:14s!important;animation-timing-function:ease-in-out!important;animation-iteration-count:infinite!important}
html.lite .auth:after{animation-name:float!important;animation-duration:14s!important;animation-delay:-6s!important;animation-timing-function:ease-in-out!important;animation-iteration-count:infinite!important}
html.lite .auth .ac>*{animation-name:vin!important;animation-duration:.5s!important;animation-fill-mode:both!important}
html.lite .auth .ac>*:nth-child(2){animation-delay:.08s!important}html.lite .auth .ac>*:nth-child(3){animation-delay:.16s!important}html.lite .auth .ac>*:nth-child(4){animation-delay:.24s!important}html.lite .auth .ac>*:nth-child(5){animation-delay:.32s!important}html.lite .auth .ac>*:nth-child(6){animation-delay:.4s!important}

body:has(.auth){padding-bottom:0!important}
/* Login: el teclado no debe tapar los campos */
body.akb .auth{align-items:flex-start;min-height:0;overflow:visible}
body.akb{padding-bottom:var(--akh,0px)!important}
/* Ofertas: botones y rol */
.obt{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.obt .b{flex:1 1 0;min-width:0;white-space:nowrap}
.obt .ob1{flex:1 1 100%}
/* Chat: reacciones */
.rxr{display:flex;gap:6px;margin-top:5px}
.rx{width:auto;min-height:0;margin:0;box-shadow:none;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:1px 9px;font-size:12px;line-height:1.7;cursor:pointer}
.rx.on{background:rgba(124,108,255,.28);border-color:#7c6cff;color:var(--tx)}
.msg small a{text-decoration:none}
/* Botones: zonas de toque cómodas y nada que los tape */
#toast{pointer-events:none}
.rx{padding:5px 12px;min-height:32px;font-size:13px;line-height:1.3}
.msg small a[data-me],.msg small a[data-md],.msg small a[data-cd]{display:inline-block;padding:7px 9px;margin:-7px -3px}
#breqs .card{content-visibility:visible}

.auth{padding:12px 16px}
.auth .ac{width:100%;max-width:400px;position:relative;z-index:1}
.auth .lg{margin-bottom:4px!important}
.auth .ax{margin:0 0 6px}.auth .axl{width:64px}
.auth .hero{font-size:23px;margin:0 0 4px}
.auth .ap{text-align:center;margin:0 0 12px;font-size:13px;line-height:1.35}
.auth .glass{padding:14px}
.auth .glass label{font-size:12px;margin:8px 0 0}
.auth .fld{margin:3px 0 6px}.auth .fld input{padding:11px 42px}
.auth .glass .seg{margin-bottom:2px}
.auth .trust{margin-top:12px;gap:6px}.auth .trust span{font-size:11px;padding:4px 9px}
.auth.reg .ap,.auth.reg .trust{display:none}
@media(max-height:640px){.auth .ax,.auth .ap{display:none}}
/* barra de carga: respuesta visible a cada toque */
#ldbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;background:linear-gradient(90deg,var(--acc),#4fc3f7);transform:scaleX(0);transform-origin:left;pointer-events:none;opacity:0}
#ldbar.on{opacity:1;animation:ldb 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ldb{0%{transform:scaleX(0)}70%{transform:scaleX(.85)}100%{transform:scaleX(1);opacity:0}}
nav button{min-width:0;white-space:nowrap;font-size:11px;padding:9px 1px}
nav:has(button:nth-child(6)) button{font-size:10px}
body[data-view="chat"] .wa,body[data-view="chat"] .up{display:none!important}

/* ---- Insignia del chat, aviso de notificaciones y rendimiento ---- */
@keyframes bdpop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
nav .bd{animation:bdpop .3s ease-out;line-height:16px;text-align:center;font-style:normal;font-weight:700;pointer-events:none}
#cbd{background:#ff3b5c}
nav button:active{transform:scale(.94)}
nav,.ov,#toast,.fab-bg{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
button,.chip,.tile,.qb,.ib,.pill,[data-o],[data-mv]{transition-duration:.1s!important}
button.b:before{display:none!important}
#nbn{position:fixed;left:10px;right:10px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;z-index:40;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#1b1d2e;border:1px solid var(--acc);border-radius:16px;padding:10px 12px;font-size:13px;box-shadow:0 14px 40px -12px #000}
#nbn span{flex:1 1 100%}
/* ---- Chat: campo que crece hacia abajo y teclado del móvil ---- */
.cmp{display:flex;gap:8px;align-items:flex-end;flex-wrap:nowrap;margin-top:8px}
.cmp textarea{flex:1;min-width:0;margin:0;resize:none;overflow-y:auto;max-height:120px;min-height:42px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.cmp .b{flex:none;align-self:flex-end}
body.kb nav,body.kb .wa,body.kb .up,body.kb #nbn,body.kb .fab,body.kb .fab-bg{display:none!important}
body.kb{padding-bottom:var(--kbh,16px)!important}
/* ---- Chat privado ---- */
.pcs{display:flex;gap:8px;margin-bottom:12px}.pcs .b{flex:1}
.bd2{display:inline-block;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.pcrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.pcrow:last-child{border-bottom:0}
.pcrow[data-po]{cursor:pointer}
.pcrow .pm{min-width:0;flex:1}
.pcrow .pv{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.msg a.pu{color:inherit;text-decoration:underline dotted;text-underline-offset:2px}
body[data-view="pchat"] .wa,body[data-view="pchat"] .up,body[data-view="pcon"] .wa,body[data-view="pcon"] .up{display:none!important}
/* ---- Chat a pantalla fija: solo se desplaza la lista de mensajes ---- */
body[data-view="chat"],body[data-view="pcon"],body[data-view="chat"].kb,body[data-view="pcon"].kb{overflow:hidden;padding-bottom:0!important}
.cwrap{display:flex;flex-direction:column;overflow:hidden;margin-bottom:0;height:60vh}
.cwrap #cl{flex:1 1 auto;min-height:0;max-height:none!important;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.cwrap .cmp{flex:none}
body.kb .pc-hide{display:none!important}

/* ---- Mercado: atajos compactos, botones de acción y pestañas de ofertas ---- */
.tiles.mini{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 12px;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tiles.mini::-webkit-scrollbar{display:none}

.mkact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.mkact .b{padding:13px 6px;font-size:14px;margin:0}
#mkT{margin:4px 0 12px}
#mkT button{font-size:13px;padding:11px 4px}
#mkT button span{opacity:.85;font-weight:600}
.comm>div{border-radius:18px!important;padding:18px 16px!important;margin:0 0 12px!important}
.comm b{font-size:30px!important}
.comm>div>span:nth-child(2){display:flex;flex-direction:column;line-height:1.25}
.pcs .b{white-space:nowrap;padding-left:6px;padding-right:6px;font-size:13px}.pcs .bd2{position:static!important;display:inline-block;margin-left:3px;transform:none!important}.pcs .b{padding-left:4px;padding-right:4px}

/* ---- Rendimiento: menos animación y menos trabajo de pintado ---- */
.sk{animation:none!important;background:var(--card)!important}
main>*,main.vin{animation:none!important}
.seg button,.chip,.tile,.qb,button.b{-webkit-tap-highlight-color:transparent}
.card,.tile,.wal,.qb{box-shadow:none!important}
.ov{animation:none!important}.md{animation:none!important}
/* ===== Tema claro / nocturno + diseño tipo QvaPay ===== */
html[data-theme=light]{--bg:#f3f4fa;--card:#fff;--card2:#eef0f8;--line:#e3e5f0;--tx:#151a30;--mut:#6a6f8c;--ok:#0a9b4a;--warn:#b86e00;--bad:#e4001b;--acc:#6a56f0;--g:linear-gradient(135deg,#6a56f0,#8a78ff);--sh:0 1px 2px rgba(20,24,60,.05),0 10px 24px -16px rgba(20,24,60,.22);color-scheme:light}
html[data-theme=light] body{background:var(--bg)}html[data-theme=light] body:before,html[data-theme=light] header:after{display:none}
html[data-theme=light] header{background:rgba(255,255,255,.94)!important;border-bottom:1px solid var(--line)}
html[data-theme=light] .card,html[data-theme=light] .tile{background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
html[data-theme=light] .card.hl{border-color:var(--ok)}html[data-theme=light] .card.dg{background:#fff5f5;border-color:#f0a3a3}
html[data-theme=light] .pill,html[data-theme=light] .ib{background:#fff;border-color:var(--line)}
html[data-theme=light] nav{background:rgba(255,255,255,.97);border-color:var(--line);box-shadow:0 10px 30px -10px rgba(20,24,60,.3)}
html[data-theme=light] nav button.on{background:rgba(106,86,240,.12);color:var(--acc)}
html[data-theme=light] input,html[data-theme=light] textarea,html[data-theme=light] select{background:#fff;border-color:var(--line);color:var(--tx)}
html[data-theme=light] .tag{background:#eceef8;color:#4a4f73;border-color:transparent}html[data-theme=light] .tag.ok{background:#dcf6e6;color:#0a7a3d}html[data-theme=light] .tag.warn{background:#fff0d1;color:#935c00}html[data-theme=light] .tag.bad{background:#fde2e2;color:#b3151f}

const LITE=(()=>{
  const H=document.documentElement,L={dev:false,net:false,slow:0,good:0,samples:[]};
  try{L.dev=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||4)<=3}catch(e){}
  try{const v=+(localStorage.getItem('lite_net')||0);if(v&&Date.now()-v<30*60000)L.net=true;if((navigator.connection||{}).saveData)L.net=true}catch(e){}
  L.apply=()=>{const on=L.dev||L.net;if(H.classList.contains('lite')!==on)H.classList.toggle('lite',on)};
  L.set=v=>{if(L.net===v)return;L.net=v;L.slow=L.good=0;try{localStorage.setItem('lite_net',v?String(Date.now()):'0')}catch(e){}L.apply();
    try{if(typeof S!=='undefined'&&S.user&&!L.dev)toast(v?'Conexión lenta: modo ligero activado':'Conexión mejor: modo normal')}catch(e){}};
  L.tick=()=>{
    if(!navigator.onLine||document.hidden)return;
    const now=Date.now();L.samples=L.samples.filter(s=>now-s.t<90000);
    const c=navigator.connection||{},sv=!!c.saveData,cs=sv||/(^|-)(2|3)g$/.test(c.effectiveType||'')||c.rtt>=700||(c.downlink>0&&c.downlink<1);
    const d=L.samples.map(s=>s.d).sort((a,b)=>a-b),n=d.length,med=n?d[n>>1]:0;
    let slow,good;
    if(sv){slow=true;good=false}
    else if(n>=3){slow=med>2200;good=med<1200}
    else{slow=cs;good=!cs}
    if(slow){L.slow++;L.good=0}else if(good){L.good++;L.slow=0}else{L.slow=L.good=0}
    if(!L.net&&L.slow>=2)L.set(true);else if(L.net&&L.good>=4&&!sv)L.set(false)};
  try{new PerformanceObserver(l=>{for(const e of l.getEntries())
    if((e.initiatorType==='fetch'||e.initiatorType==='xmlhttprequest')&&/\/rest\/v1\//.test(e.name)&&e.duration>0&&e.duration<20000)L.samples.push({t:Date.now(),d:e.duration});
    if(L.samples.length>40)L.samples.splice(0,L.samples.length-40)}).observe({type:'resource'})}catch(e){}
  addEventListener('online',()=>{L.slow=L.good=0});
  L.apply();setInterval(L.tick,4000);
  return L})();
function countTo(el,v){const from=parseFloat(String(el.textContent).replace(/\./g,'').replace(',','.'))||0,to=+v||0;
  if(from===to||document.documentElement.classList.contains('lite')||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=n(to,2);return}
  const t0=performance.now();el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
  const f=now=>{const k=Math.min(1,(now-t0)/600);el.textContent=n(from+(to-from)*(1-Math.pow(1-k,3)),2);if(k<1&&el.isConnected)requestAnimationFrame(f);else el.textContent=n(to,2)};requestAnimationFrame(f)}

    const want=(navigator.language||'es-US').toLowerCase();

/* Revisión con IA: comprobaciones extra para Zelle, PayPal, euros, pesos mexicanos, rublos, etc. */
function fxChecks(t,o){
  const P=parseM(o&&o.methods),c=P.c;if(!isFx(c))return[];
  const R=[],T=String(t||''),ms=P.m.split(', ').filter(Boolean);
  const KW={'Zelle':/zelle/i,'PayPal':/pay\s*pal/i,'Cash App':/cash\s*app/i,'Wise':/\bwise\b|transferwise/i,'Transferencia SEPA':/sepa|iban/i,'Bizum':/bizum/i,'Revolut':/revolut/i,'SPEI':/spei|\bcep\b|clabe/i,'Mercado Pago':/mercado\s*pago/i,'Depósito OXXO':/oxxo/i,'Interac e-Transfer':/interac|e-?transfer/i,'Faster Payments':/faster\s*payments|sort\s*code/i,'Sberbank':/sber|сбер/i,'Tinkoff':/tinkoff|тинькофф|т-банк/i,'SBP (pagos rápidos)':/\bsbp\b|сбп/i};
  const known=ms.filter(m=>KW[m]);
  if(known.length){const hit=known.filter(m=>KW[m].test(T)),other=Object.keys(KW).filter(m=>!ms.includes(m)&&KW[m].test(T));
    if(hit.length)R.push(['ok',`Método: en la captura aparece ${hit.join(' / ')}.`]);
    else R.push(['warn',`Método: no se ve el nombre de ${known.join(' / ')} en la captura. Confirma que el pago salió por ese método.`]);
    if(!hit.length&&other.length)R.push(['warn',`Método: la captura parece de otro servicio (${other.join(' / ')}), no del acordado.`])}
  const bad=/\b(pending|processing|in progress|failed|declined|denied|cancel+ed|on hold|reversed|returned|unsuccessful|expired|not completed|scheduled)\b/i.test(T),good=/\b(sent|completed|complete|delivered|paid|success(?:ful)?|transferred|enviado|completado)\b/i.test(T);
  if(bad&&!good)R.push(['warn','Estado: la captura parece indicar que el pago NO se completó (pendiente, en proceso, fallido o similar).']);
  else if(good&&!bad)R.push(['ok','Estado: la captura indica que el pago fue enviado o completado.']);
  else if(bad&&good)R.push(['na','Estado: aparecen palabras de pago completado y de pago pendiente. Revísalo con cuidado.']);
  const codes=[...new Set((T.match(/\b(USD|EUR|MXN|CAD|GBP|RUB)\b/g)||[]))];
  if(codes.length&&!codes.includes(c))R.push(['warn',`Moneda: la captura muestra ${codes.join(', ')} y la operación es en ${c}.`]);
  const det=String(o&&o.payment_details||''),em=det.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  if(em){const e=em[0].toLowerCase(),lc=T.toLowerCase();lc.includes(e)?R.push(['ok','Destino: aparece el correo del vendedor.']):R.push(['na',`Destino: no se ve el correo completo del vendedor (${em[0].slice(0,3)}…); puede estar oculto.`])}
  const nameHit=(nm,txt)=>String(nm||'').split(/\s+/).filter(w=>w.length>=3).some(w=>txt.toLowerCase().includes(w.toLowerCase()));
  const hm=det.match(/Titular:\s*([^·]+)/);
  if(hm){nameHit(hm[1],T)?R.push(['ok','Destino: aparece el nombre del titular que cobra.']):R.push(['na','Destino: no aparece el nombre del titular que cobra (puede estar oculto).'])}
  const pm=String(o&&o._payer||'').match(/Titular:\s*([^·]+)/);
  if(pm){nameHit(pm[1],T)?R.push(['ok',`Pagador: aparece el nombre registrado (${pm[1].trim()}).`]):R.push(['warn',`Pagador: no aparece el nombre registrado (${pm[1].trim()}). El pago podría haber salido de otra persona.`])}
  const MS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12},ds=[];
  T.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})\b/gi,(m,mo,d,y)=>{ds.push(`${y}-${String(MS[mo.toLowerCase().slice(0,3)]).padStart(2,'0')}-${String(d).padStart(2,'0')}`);return m});
  T.replace(/\b(20\d{2})-(\d{2})-(\d{2})\b/g,(m,y,mo,d)=>{ds.push(`${y}-${mo}-${d}`);return m});
  if(ds.length){const dt=ds.sort().pop(),cr=o&&o.created_at?HAV(o.created_at):null,hoy=HAV(Date.now());
    if(dt>hoy)R.push(['warn',`Fecha: la captura dice ${fmtD(dt)}, que es una fecha futura.`]);
    else if(cr&&dt<cr)R.push(['warn',`Fecha: la captura es del ${fmtD(dt)}, anterior a la operación (${fmtD(cr)}). Puede ser una captura vieja.`]);
    else R.push(['ok',`Fecha: ${fmtD(dt)}, coincide con la operación.`])}
  const cf=T.match(/confirmation\s*(?:number|no\.?|#|code)?\s*[:#]?\s*([A-Z0-9]{6,20})/i);if(cf)R.push(['na',`Confirmación: ${cf[1].toUpperCase()}.`]);
  if(c==='RUB')R.push(['na','Rublos: el lector de texto no lee letras rusas. Comprueba a mano el nombre del titular y el estado; el monto y los números sí se leen.']);
  const rv=ms.filter(isRev);if(rv.length)R.push(['na',`⚠️ ${rv.join(' / ')} puede revertirse: aunque la captura parezca correcta, Tororo no cubre devoluciones. Confirma solo cuando el dinero figure como completado en tu cuenta.`]);
  return R}

/* Ajusta el chat al alto visible de la pantalla (sin que la página suba y baje) */
let KBSTICK=true; /* ¿estabas viendo el final del chat? solo entonces el teclado lo mantiene abajo */
function fitChat(){
  const w=document.getElementById('cwrap');if(!w)return;
  const v=window.visualViewport,vh=v?v.height:innerHeight,off=v?v.offsetTop:0,kb=document.body.classList.contains('kb');
  const nv=document.querySelector('nav'),res=kb||!nv?8:Math.max(8,Math.round(innerHeight-nv.getBoundingClientRect().top+8));
  const top=w.getBoundingClientRect().top-off;
  {const nh=Math.max(180,Math.floor(vh-top-res));if(Math.abs(nh-w.offsetHeight)>1)w.style.height=nh+'px'}

/* Caja de escribir del chat: crece hacia abajo y sube sobre el teclado */
const KB=(()=>{
  const coarse=matchMedia('(pointer:coarse)').matches;
  const cur=()=>window.visualViewport?visualViewport.height:innerHeight;let base=cur(),seen=false;
  const fit=t=>{if(!t)return false;const h0=t.offsetHeight,grow=t.scrollHeight>t.clientHeight+1;
    if(grow)t.style.height=Math.min(t.scrollHeight,120)+'px';
    else if(!t.value||(t._l||0)>t.value.length){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}
    t._l=t.value.length;
    const cl=document.getElementById('cl');if(cl&&KBSTICK)cl.scrollTop=cl.scrollHeight;
    return t.offsetHeight!==h0};
  const upd=()=>{const v=window.visualViewport;const h=v?Math.max(0,Math.round(innerHeight-v.height-v.offsetTop)):0;document.body.style.setProperty('--kbh',(h+16)+'px')};
  const show=()=>{const t=document.activeElement;if(!t||!t.matches||!t.matches('.cmp textarea'))return;
    const c=t.closest('.cmp'),v=window.visualViewport,vb=v?v.offsetTop+v.height:innerHeight,r=c.getBoundingClientRect();
    const dv=document.body.dataset.view;if(dv!=='chat'&&dv!=='pcon'&&r.bottom>vb-8)scrollBy(0,Math.ceil(r.bottom-vb+8));
    const cl=$('cl');if(cl&&KBSTICK)cl.scrollTop=cl.scrollHeight};
  let T;const later=(ms=120)=>{clearTimeout(T);T=setTimeout(()=>{upd();show();fitChat()},ms)};
  document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.id==='cl')KBSTICK=t.scrollHeight-t.scrollTop-t.clientHeight<120},true);
  document.addEventListener('focusin',e=>{if(!e.target.matches||!e.target.matches('.cmp textarea'))return;
    {const c0=$('cl');KBSTICK=!c0||c0.scrollHeight-c0.scrollTop-c0.clientHeight<120}
    if(coarse){base=Math.max(base,cur());seen=false;document.body.classList.add('kb')}upd();fit(e.target);later(80);later(350)});
  document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;
    if(!a||!a.matches||!a.matches('.cmp textarea')){document.body.classList.remove('kb');document.body.style.removeProperty('--kbh');fitChat()}},150));
  document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.cmp textarea')){if(fit(e.target))later(0)}});
  /* tocar Enviar no cierra el teclado (si no, el botón se mueve y el toque se pierde) */
  document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.cmp .b'))e.preventDefault()});
  /* Si el teclado se cierra (gesto atrás) y la caja sigue enfocada, se quita el modo teclado para que vuelva la barra de abajo */
  const onVV=()=>{const c=cur();
    if(!document.body.classList.contains('kb')){base=c;return}
    if(base-c>120){seen=true}
    else if(seen){seen=false;const a=document.activeElement;if(a&&a.matches&&a.matches('.cmp textarea'))a.blur()}
    later(30)};
  if(window.visualViewport)visualViewport.addEventListener('resize',onVV);else addEventListener('resize',onVV);
  /* tocar los mensajes cierra el teclado */
  document.addEventListener('click',e=>{const a=document.activeElement;
    if(a&&a.matches&&a.matches('.cmp textarea')&&e.target.closest&&e.target.closest('#cl')&&!e.target.closest('a,button'))a.blur()});
  return{coarse,fit}})();

async function analyzeProofs(o,cur){

  const ic={ok:'✅',warn:'⚠️',na:'ℹ️'},i=t.indexOf('\n\nSolo es un an'),blk='\n\n🔬 Análisis del archivo (servicio forense)\n'+f.map(([l,x])=>(x.startsWith('   ')?'':ic[l]+' ')+x).join('\n');

async function analyzeProofs0(o,cur){
  const L=[],W=[];const ok=t=>L.push('✅ '+t),bad=t=>{L.push('⚠️ '+t);W.push(t)},na=t=>L.push('➖ '+t);
  const exp=due(o,cur),ref=o.mediation_ref||'',tail=((String(o.payment_details||'').match(/\d[\d\s]{6,}\d/g)||[]).map(x=>x.replace(/\s+/g,''))[0]||'').slice(-4);
  const prs=[['buyer',o.buyer_proof],['mediation',o.mediation_proof]].filter(x=>x[1]);
  try{const{data:em}=await sb.from('order_messages').select('sender_id,body').eq('order_id',o.id).like('body','[Prueba]%').order('created_at',{ascending:false}).limit(8);
    (em||[]).filter(m=>m.sender_id===o.buyer_id).map(m=>(String(m.body).match(/\[img:([A-Za-z0-9._\/-]+)\]/)||[])[1]).filter(pa=>pa&&pa.startsWith(o.id+'/')&&!prs.some(q=>q[1]===pa)).slice(0,2).forEach((pa,i)=>prs.push(['ev'+i,pa]))}catch(e){}
  const txt={},hs={};
  /* las consultas a la base de datos arrancan ya, mientras se descargan y leen las imágenes */
  const qHash=sb.from('proof_hashes').select('order_id,phash').neq('order_id',o.id).order('created_at',{ascending:false}).limit(1500).then(r=>r,()=>({}));
  const qRef=ref?sb.from('orders').select('id').eq('mediation_ref',ref).neq('id',o.id).limit(3).then(r=>r,()=>({})):null;
  const blobs=await Promise.all(prs.map(([k,pa])=>getProof(pa).then(b=>[k,pa,b],()=>null)));
  await Promise.all(blobs.filter(Boolean).map(async([k,pa,b])=>{try{hs[k]=await aHash(b)}catch(e){}}));
  for(const it of blobs){if(!it)continue;const[k,pa,b]=it;let t=OCRC.get(pa);
    if(t==null){try{t=await ocrBlob(b);OCRC.set(pa,t)}catch(e){}}
    if(t!=null)txt[k]=t}
  for(const it of blobs){if(!it)continue;const[k,pa,b]=it;try{(await fxCheck(b,o,blobs.filter(Boolean).length>1?(k==='buyer'?'Captura del comprador':k==='mediation'?'Captura de mediación':'Prueba del comprador en el chat'):'')).forEach(([l,x])=>l==='ok'?ok(x):l==='warn'?bad(x):na(x))}catch(e){}}
  const all=Object.values(txt).join('\n');
  if(!Object.keys(txt).length)na('No se pudo leer el texto de las capturas (el lector de texto no cargó). Revísalas a ojo.');
  else{
    if(txt.buyer!=null){hasAmount(txt.buyer,exp)?ok(`Monto: aparece ${mny(exp,cur)} ${cur} en la captura del pago.`):bad(`Monto: no se encontró ${mny(exp,cur)} ${cur} en la captura del pago.`)}
    if(txt.buyer!=null)extraChecks(txt.buyer,o).forEach(([l,x])=>l==='ok'?ok(x):l==='warn'?bad(x):na(x));
    if(tail){hasTail(txt.buyer||all,tail)?ok(`Destino: aparecen los últimos dígitos (${tail}) de los datos de cobro.`):bad(`Destino: no se vieron los últimos dígitos (${tail}) de los datos de cobro (pueden estar ocultos).`)}
    if(ref){hasRef(all,ref)?ok(`Referencia ${ref}: aparece en las capturas.`):bad(`Referencia ${ref}: no aparece en las capturas.`)}
    const evT=Object.keys(txt).filter(k=>/^ev\d/.test(k)).map(k=>txt[k]).join('\n');
    if(evT){hasAmount(evT,exp)?ok(`Pruebas del comprador en el chat: aparece el monto ${mny(exp,cur)} ${cur}.`):na(`Pruebas del comprador en el chat: no se vio el monto ${mny(exp,cur)} ${cur} (pueden ser capturas de otro tipo).`);
      if(tail)hasTail(evT,tail)&&ok(`Pruebas del comprador en el chat: aparecen los últimos dígitos (${tail}) del destino.`)}
  }
  try{const{data:hh}=await qHash;
    const dup=new Set();(hh||[]).forEach(r=>Object.values(hs).forEach(h=>{if(r.phash&&hamm(h,r.phash)<=4)dup.add(r.order_id.slice(0,8))}));
    if(dup.size)bad('Imagen repetida: se parece mucho a capturas de otra(s) operación(es): '+[...dup].slice(0,3).join(', ')+'.');else if(Object.keys(hs).length)ok('Imagen: no coincide con capturas de otras operaciones.')}catch(e){}
  if(ref)try{const{data:rr}=await qRef;
    if(rr&&rr.length)bad('La misma referencia ya se usó en otra operación: '+rr.map(x=>x.id.slice(0,8)).join(', ')+'.');else ok('La referencia no se había usado antes.')}catch(e){}
  const head=W.length?`Resultado: ${W.length} punto(s) a revisar.`:'Resultado: sin señales raras en lo que se pudo comprobar.';
  return `${HDR}\n${head}\n\n${L.join('\n')}\n\nSolo es un análisis automático de IA, orientativo: NO demuestra si el pago es real o falso y puede equivocarse al leer capturas borrosas. La decisión la toma el administrador.`}

/* Revisión de la captura para el VENDEDOR: solo OCR en el dispositivo (sin servicio externo) */
async function sellerCheck(o,cur){
  const[r,f]=await Promise.all([sellerCheck0(o,cur),forenseLines(o).catch(()=>[])]);
  r.checks=(r.checks||[]).concat(f.map(([level,text])=>({level,text})));return r}
async function sellerCheck0(o,cur){
  const na=t=>({checks:[{level:'na',text:t}]});
  if(!o.buyer_proof)return na('El comprador aún no subió la captura.');
  let t=OCRC.get(o.buyer_proof);
  if(t==null){let b;try{b=await getProof(o.buyer_proof)}catch(e){return na('No se pudo descargar la captura. Revísala tú mismo.')}
    try{t=await ocrBlob(b)}catch(e){return na('El lector de texto no cargó (revisa tu conexión). Revísala tú mismo.')}OCRC.set(o.buyer_proof,t)}
  if(!String(t).replace(/\s+/g,'').length)return na('No se pudo leer texto en la captura (borrosa o sin texto). Revísala tú mismo.');
  const C=[],add=(level,text)=>C.push({level,text});
  const exp=due(o,cur),tail=((String(o.payment_details||'').match(/\d[\d\s]{6,}\d/g)||[]).map(x=>x.replace(/\s+/g,''))[0]||'').slice(-4);
  hasAmount(t,exp)?add('ok',`Monto: aparece ${mny(exp,cur)} ${cur} en la captura.`):add('warn',`Monto: no se encontró ${mny(exp,cur)} ${cur} en la captura.`);
  if(tail)hasTail(t,tail)?add('ok',`Destino: aparecen los últimos dígitos (${tail}) de tus datos de cobro.`):add('warn',`Destino: no se vieron los últimos dígitos (${tail}) de tus datos de cobro (pueden estar ocultos).`);
  extraChecks(t,o).forEach(([l,x])=>add(l,x));
  try{const fb=await getProof(o.buyer_proof);(await fxCheck(fb,o)).forEach(([l,x])=>add(l,x))}catch(e){}
  return{checks:C}}

/* ---------- Admin: expedientes KYC por usuario (ver y compartir) ---------- */
const KST={approved:['Aprobado','ok'],pending:['Pendiente','warn'],rejected:['Rechazado','bad'],incomplete:['Faltan datos','warn']};
const KMISS={name:'Nombre',id:'Documento',front:'Frente',back:'Reverso',selfie:'Selfie'};
const KDOCS=[['doc_front','Frente','frente'],['doc_back','Reverso','reverso'],['selfie','Selfie con carnet','selfie']];
const kycUrls=(x,secs)=>Promise.all(KDOCS.map(async([k])=>x[k]?((await sb.storage.from('kyc').createSignedUrl(x[k],secs)).data?.signedUrl||null):null));
async function kycFiles(x){
  const u=await kycUrls(x,300),nm=(x.full_name||x.profiles?.username||'usuario').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase(),out=[];
  for(let i=0;i<KDOCS.length;i++){if(!u[i])continue;
    const r=await fetch(u[i]);if(!r.ok)throw new Error('No se pudo preparar: '+KDOCS[i][1]);
    const b=await r.blob(),ext=(String(x[KDOCS[i][0]]).split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    out.push(new File([b],`kyc-${nm}-${KDOCS[i][2]}.${ext}`,{type:b.type||'image/jpeg'}))}
  if(!out.length)throw new Error('Este expediente no tiene imágenes');return out}
const kycText=(x,links)=>`🪪 KYC · ${APP_NAME} P2P\nNombre: ${x.full_name||'—'}\nDocumento: ${x.id_number||'—'}\nUsuario: @${x.profiles?.username||'—'}\nEstado: ${(KST[x.status]||[x.status])[0]}\nEnviado: ${when(x.created_at)}`+(links?'\n\n'+KDOCS.map(([,l],i)=>links[i]?`${l}: ${links[i]}`:'').filter(Boolean).join('\n'):'');

function shareKyc(x){
  const m=modal(`<h3>Compartir KYC</h3>
   <div class="warnbox bad">⚠️ Son documentos de identidad. Compártelos solo con quien sea imprescindible (autoridad, banco o parte afectada) y por un canal que controles.</div>
   <b>${esc(x.full_name||'—')}</b> <span class="mut">@${esc(x.profiles?.username||'—')} · ${esc(x.id_number||'')}</span>
   <div class="grid2" style="margin-top:12px"><button class="b" id="ks1" disabled>Preparando…</button><button class="b gh" id="ks3" disabled>Descargar</button></div>
   <label style="margin-top:14px">Enlaces temporales (se vencen solos)</label>
   <select id="ksD"><option value="3600">Duran 1 hora</option><option value="86400" selected>Duran 24 horas</option><option value="604800">Duran 7 días</option></select>
   <button class="b gh w" id="ks2">Generar y copiar enlaces</button>
   <textarea id="ksT" rows="6" readonly style="display:none;margin-top:10px"></textarea>
   <button class="b gh w" style="margin-top:8px" id="ks4">Cerrar</button>`);
  const prep=kycFiles(x),B1=m.querySelector('#ks1'),B3=m.querySelector('#ks3');
  prep.then(()=>{B1.disabled=false;B1.textContent='Compartir fotos';B3.disabled=false}).catch(e=>{B1.textContent='No disponible';toast(friendly(e),'err')});
  m.querySelector('#ks4').onclick=()=>m.remove();
  B1.onclick=async()=>{try{const files=await prep;
    if(navigator.canShare&&navigator.canShare({files}))await navigator.share({files,text:kycText(x)});
    else toast('Este navegador no comparte archivos: usa Descargar o los enlaces temporales','err')}catch(e){if(!e||e.name!=='AbortError')toast(friendly(e),'err')}};
  B3.onclick=async()=>{try{const files=await prep;files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},i*350))}catch(e){toast(friendly(e),'err')}};
  m.querySelector('#ks2').onclick=ev=>act(ev.target,async()=>{
    const u=await kycUrls(x,+m.querySelector('#ksD').value),t=kycText(x,u),ta=m.querySelector('#ksT');
    ta.value=t;ta.style.display='block';ta.select();
    try{await navigator.clipboard.writeText(t);toast('Enlaces copiados','good')}catch(e){toast('Copia el texto de abajo manualmente','')}})}

      el.onclick=e=>{const c=e.target.closest('[data-i]');if(c)show(+c.dataset.i)};
      if(L.length&&tot>0)show(bi,'mejor día');else{const rd=document.getElementById('anR');if(rd)rd.style.display='none'}};
    document.getElementById('anSg').onclick=e=>{const bt=e.target.closest('button[data-r]');if(!bt)return;document.querySelectorAll('#anSg button').forEach(x=>x.classList.toggle('on',x===bt));drawTrend(+bt.dataset.r)};

}

/* Staff: recargas de saldo pagadas a sus propias tarjetas (se oculta sola si aún no está instalada en Supabase) */
async function staffTopups(my){

  if(my!==NAV||!$('recbox'))return;

  const meU=String(S.profile?.username||'').toLowerCase(),ALL=Array.isArray(data)?data:[];

    const drop=id=>{L=L.filter(x=>String(x.id)!==String(id));draw()};
    box.querySelectorAll('[data-pv]').forEach(b=>b.onclick=async()=>{const{data:u}=await sb.storage.from('proofs').createSignedUrl(b.dataset.pv,600);u?zoom(u.signedUrl):toast('No se pudo cargar la captura','err')});
    box.querySelectorAll('[data-sa]').forEach(b=>b.onclick=async()=>{const m=await ask('Acreditar recarga','<p>Confirma que el dinero ya llegó a tu tarjeta. El saldo se acreditará al usuario y no se puede deshacer.</p>','Acreditar','ok');if(!m)return;m.remove();

    box.querySelectorAll('[data-sx]').forEach(b=>b.onclick=async()=>{const m=await ask('Rechazar recarga','<p>La recarga se marcará como rechazada.</p>','Rechazar','bad');if(!m)return;m.remove();

  draw()}

async function getMaint(){try{const{data,error}=await sb.rpc('get_maintenance');return error?null:(data||null)}catch(e){return null}}
const maintOn=()=>!!(S.maint&&S.maint.active);
const isAdm=()=>!!(S.profile&&S.profile.is_admin);
function maintLeft(t){if(!t)return'Volveremos pronto.';const ms=new Date(t)-Date.now();if(!(ms>0))return'Estamos terminando; vuelve en unos minutos.';
  const m=Math.ceil(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
  return'Faltan '+[d?d+' d':'',h?h+' h':'',(mm&&!d)?mm+' min':''].filter(Boolean).join(' ')}
function drawMaint(){
  const m=S.maint,on=maintOn(),block=on&&!isAdm()&&!(S.maintPass&&!S.profile);
  let el=$('mnt');
  if(!block){
    if(el){el.remove();document.body.style.overflow=''}
    $app.inert=false;clearInterval(S.mntT);S.mntT=null;
    let b=$('mntb');
    if(on&&isAdm()){if(!b){b=document.createElement('div');b.id='mntb';b.textContent='🛠️ Modo mantenimiento ACTIVO: los usuarios no pueden operar';document.body.appendChild(b)}}
    else if(b)b.remove();
    return}
  const key=JSON.stringify([m.message,m.back_at,!!S.profile,!!S.user]);
  if(!el){el=document.createElement('div');el.id='mnt';el.setAttribute('role','alert');document.body.appendChild(el);
    el.onclick=async e=>{const t=e.target.closest('#mntr,#mnta,#mntx');if(!t)return;e.preventDefault();
      if(t.id==='mnta'){S.maintPass=true;drawMaint();return}
      if(t.id==='mntx'){S.maintPass=true;try{await sb.auth.signOut()}catch(x){}S.user=null;S.profile=null;S.wallet=null;drawMaint();renderAuth('login');return}
      t.disabled=true;const r=await getMaint();t.disabled=false;
      if(!r)return toast('No se pudo comprobar. Revisa tu internet','err');
      S.maint=r;if(!r.active){location.reload();return}drawMaint()}}
  if(el.dataset.k!==key){el.dataset.k=key;
    el.innerHTML=`<div class="mnt-c"><div class="mnt-i">🛠️</div><h1>PÁGINA EN MANTENIMIENTO</h1>${m.message?`<p class="mnt-m">${esc(m.message)}</p>`:''}
      <div class="mnt-w">${m.back_at?`<div class="mut">Volveremos el</div><b>${esc(new Date(m.back_at).toLocaleString('es',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))}</b>`:''}<div id="mntl" class="mut"></div></div>
      <button class="b w" id="mntr">Comprobar ahora</button>${(S.user||S.profile)?'<a href="#" id="mntx" class="mut">Cerrar sesión · entrar como administrador</a>':'<a href="#" id="mnta" class="mut">Acceso administrador</a>'}</div>`}
  const l=$('mntl');if(l)l.textContent=maintLeft(m.back_at);
  document.body.style.overflow='hidden';$app.inert=true;
  if(!S.mntT)S.mntT=setInterval(async()=>{if(document.hidden)return;const r=await getMaint();if(r){S.maint=r;if(!r.active){location.reload();return}}drawMaint()},15000)}

    act(b,async()=>{await rpc('admin_set_maintenance',{p_active:true,p_back_at:v?new Date(v).toISOString():null,p_message:msg||null});S.maint=await getMaint();drawMaint();viewAdmin()},'Mantenimiento activado')};
  if($('mtOff'))$('mtOff').onclick=ev=>act(ev.currentTarget,async()=>{await rpc('admin_set_maintenance',{p_active:false});S.maint=await getMaint();drawMaint();viewAdmin()},'Mantenimiento desactivado')}

/* ---------- Sin conexión ---------- */
function renderOffline(){
  S.offScreen=1;
  $app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"><div style="max-width:380px">${brand(34)}<div style="font-size:44px;margin:18px 0 6px">📡</div><h2 style="margin:0 0 8px">Sin conexión</h2><p class="mut">Tororo necesita internet para mostrar tus saldos y operaciones. Esta pantalla se actualiza sola cuando vuelva la conexión.</p><button class="b" id="offr">Reintentar</button></div></div>`;
  $('offr').onclick=()=>{if(navigator.onLine)boot();else toast('Todavía no hay internet','err')}}
addEventListener('online',()=>{if(S.offScreen){S.offScreen=0;boot()}});
/* Hay red (Wi-Fi o datos) pero el servidor no responde: no se muestra un panel falso con saldo 0 */
function renderConnFail(){
  S.offScreen=1;
  $app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"><div style="max-width:380px">${brand(34)}<div style="font-size:44px;margin:18px 0 6px">🐢</div><h2 style="margin:0 0 8px">No se pudo conectar</h2><p class="mut">Tu internet está activo, pero la conexión con Tororo va muy lenta o se cortó. <b>Tus saldos y operaciones están a salvo.</b> Reintentamos solos cada pocos segundos.</p><button class="b w" id="cfr" style="margin-top:12px">Reintentar ahora</button></div></div>`;
  const go_=()=>{clearTimeout(S.cft);if(navigator.onLine)boot();else renderOffline()};
  $('cfr').onclick=()=>{$('cfr').textContent='Reintentando…';go_()};
  clearTimeout(S.cft);S.cft=setTimeout(()=>{if(S.offScreen&&document.getElementById('cfr'))go_()},10000)}

/* ---------- Cola sin conexión: SOLO mensajes de chat.
   Todo lo que mueve dinero (publicar, comprar, retirar, confirmar pagos) NO se guarda para después. ---------- */
const OBX={
  key(){return'obx_'+(S.user?S.user.id:'')},
  get(){try{return JSON.parse(lsGet(this.key())||'[]')}catch(e){return[]}},
  set(a){lsSet(this.key(),JSON.stringify(a))},
  add(it){const a=this.get();if(a.length>=30)throw new Error('Hay demasiadas acciones pendientes. Espera a tener internet.');a.push({...it,id:Date.now()+'-'+Math.random().toString(36).slice(2,7)});this.set(a)},
  async flush(){
    if(this.busy||!S.user||!navigator.onLine)return;
    if(!this.get().length)return;
    this.busy=true;let ok=0,bad=0;
    try{
      for(const it of this.get()){
        try{
          let r=null;
          if(it.t==='chat')r=await sb.from('order_messages').insert({order_id:it.order_id,sender_id:S.user.id,body:it.body});
          if(r&&r.error)throw r.error;
          ok++
        }catch(e){
          if(/fetch|network|abort|timed? ?out|load failed/i.test(String((e&&e.message)||e)))break;
          bad++
        }
        this.set(this.get().filter(x=>x.id!==it.id))
      }
    }finally{this.busy=false}
    if(ok)toast(ok===1?'Se envió 1 acción guardada sin conexión':'Se enviaron '+ok+' acciones guardadas sin conexión','good');
    if(bad)toast(bad+' acción(es) guardada(s) no se pudieron enviar','err');
    if(ok&&S.view==='order')go(S.view)}};
addEventListener('online',()=>setTimeout(()=>OBX.flush(),1500));

  const eod=d=>{const x=new Date(d);x.setHours(23,59,59,0);return x},todayEnd=()=>eod(new Date()),weekEnd=()=>{const x=new Date();x.setDate(x.getDate()+(7-x.getDay()));return eod(x)};
  const draw=async()=>{
    const{data,error}=await sb.rpc('admin_duty_overview');
    if(my!==NAV||!$('dutyb'))return;
    if(error){$('dutyb').innerHTML='<div class="warnbox bad">Falta ejecutar <code>turnos_admin.sql</code> en Supabase.</div>';return}
    const st=data.staff||[],ac=data.actions||[];
    $('dutyb').innerHTML=`<p class="mut" style="margin-top:0">Elige quién está de turno. Quien esté libre no puede revisar verificaciones ni resolver mediaciones.</p>
    <label style="display:flex;gap:10px;margin:6px 0 12px;align-items:flex-start"><input type="checkbox" id="dcr" ${data.can_resolve?'checked':''} style="width:auto;margin:3px 0 0"><span>Los administradores de turno pueden resolver mediaciones (liberar o devolver USDT). Cada decisión queda registrada con su motivo.</span></label>
    ${st.length?st.map(u=>`<div class="card" style="margin:0 0 8px"><div class="row"><b>@${esc(u.username)}</b><span class="tag ${u.on?'ok':''}">${u.on?'De turno'+(u.until?' hasta '+when(u.until):''):'Libre'}</span></div><div class="grid2" style="margin-top:8px"><button class="b sm" data-dt="${u.id}|today">Hoy</button><button class="b sm" data-dt="${u.id}|week">Esta semana</button><button class="b gh sm" data-dt="${u.id}|always">Sin límite</button>${u.on?`<button class="b bad sm" data-dt="${u.id}|off">Quitar turno</button>`:''}</div></div>`).join(''):'<p class="mut">Primero añade administradores arriba.</p>'}
    <h4 style="margin:14px 0 6px">Últimas decisiones de mediación</h4>${ac.length?ac.map(a=>`<div class="mut" style="font-size:13px;padding:6px 0;border-top:1px solid var(--line)"><b>@${esc(a.staff||'?')}</b> · ${a.action==='release'?'liberó al comprador':'devolvió al vendedor'} · orden ${esc(String(a.order_id).slice(0,8))} · ${when(a.created_at)}<br>${esc(a.note||'')}</div>`).join(''):'<p class="mut">Todavía no hay decisiones.</p>'}`;
    $('dcr').onchange=e=>act(e.target,async()=>{await rpc('admin_set_staff_cfg',{p_can_resolve:e.target.checked});await draw()},'Guardado');
    $('dutyb').querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{const[id,k]=b.dataset.dt.split('|');
      act(b,async()=>{await rpc('admin_set_duty',{p_user:id,p_on:k!=='off',p_until:k==='today'?todayEnd().toISOString():k==='week'?weekEnd().toISOString():null});await draw()},k==='off'?'Turno quitado':'Turno asignado')})};
  await draw()}

/* ---------- Mediaciones para administradores secundarios de turno ---------- */
async function staffMed(D,my){
  const box=$('medbox');if(!box||!D.can)return;
  if(!D.on){box.innerHTML='<div class="card mut">Estás fuera de turno.</div>';return}
  box.innerHTML=skel(1);
  const{data,error}=await sb.rpc('staff_mediation_queue');
  if(my!==NAV||!$('medbox'))return;
  if(error){box.innerHTML=`<div class="warnbox bad">${esc(friendly(error))}</div>`;return}
  const meU=String(S.profile?.username||'').toLowerCase(),meI=S.user.id,ALL=data||[],R=ALL.filter(x=>x.buyer_id!==meI&&x.seller_id!==meI&&String(x.buyer||'').toLowerCase()!==meU&&String(x.seller||'').toLowerCase()!==meU),own=ALL.length-R.length,tb=main().querySelector('[data-at="med"]');if(tb)tb.textContent='⚖️ Mediaciones'+(R.length?' · '+R.length:'');
  box.innerHTML=(own?`<div class="warnbox">🔒 ${own} mediación${own>1?'es':''} donde participas tú no se muestra${own>1?'n':''} aquí: solo el dueño puede resolverla${own>1?'s':''}.</div>`:'')+(R.length?R.map(o=>`<div class="card"><div class="row"><b>${n(o.amount,2)} USDT</b><span class="tag warn">Ref. ${esc(o.mediation_ref||'—')}</span></div><div class="mut">@${esc(o.buyer)} compra a @${esc(o.seller)} · ${when(o.updated_at)}</div><button class="b sm" style="margin-top:8px" data-mo="${o.id}">Revisar</button></div>`).join(''):'<div class="card mut">No hay mediaciones pendientes.</div>');
  box.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>act(b,async()=>{
    const o=R.find(x=>x.id===b.dataset.mo);
    const[bp,mp]=await Promise.all([o.buyer_proof?proofImg(o.buyer_proof,'El comprador'):'',o.mediation_proof?proofImg(o.mediation_proof,'El comprador'):'']);
    const msgs=(o.messages||[]).map(x=>`<div class="mut" style="font-size:12px;margin-bottom:3px"><b>@${esc(x.who||'?')}</b>: ${esc(x.body)}</div>`).join('')||'<p class="mut">Sin mensajes.</p>';
    const m=modal(`<h3>Mediación · ${n(o.amount,2)} USDT</h3><p class="mut">Comprador @${esc(o.buyer)} · Vendedor @${esc(o.seller)}${o.seller_denied?' · <b>el vendedor marcó que no recibió</b>':''}</p>
      <p>Precio ${n(o.price,2)} · ${esc(o.methods||'')}</p><p class="mut">Cobro del vendedor: ${esc(o.details||'—')}</p><p>Referencia del comprador: <b>${esc(o.mediation_ref||'—')}</b></p>
      <h4>Captura del pago</h4>${bp||'<p class="mut">—</p>'}<h4>Captura de sus últimas operaciones</h4>${mp||'<p class="mut">—</p>'}<h4>Chat</h4>${msgs}
      <div class="grid2" style="margin-top:12px"><button class="b ok" id="mrl">Liberar al comprador</button><button class="b bad" id="mrf">Devolver al vendedor</button></div><button class="b gh w" id="mx" style="margin-top:8px">Cerrar</button>`);
    m.querySelector('#mx').onclick=()=>m.remove();m.querySelectorAll('img').forEach(i=>i.onclick=()=>zoom(i.src));
    const dec=(btn,action,title,txt)=>btn.onclick=async()=>{
      const q=await ask(title,`<p>${txt}</p><label>Motivo (obligatorio)</label><textarea id="rn" rows="3" placeholder="Ej: la referencia coincide con el pago"></textarea>`,'Confirmar',action==='release'?'ok':'bad');if(!q)return;
      const note=q.querySelector('#rn').value.trim();q.remove();if(note.length<5)return toast('Escribe el motivo (mínimo 5 letras) y vuelve a intentarlo','err');m.remove();
      act(btn,async()=>{await rpc('staff_resolve_order',{p_order:o.id,p_action:action,p_note:note});await staffMed(D,my)},action==='release'?'USDT liberados al comprador':'USDT devueltos al vendedor')};
    dec(m.querySelector('#mrl'),'release','Liberar USDT al comprador','Confirmas que el pago del comprador es real. No se puede deshacer.');
    dec(m.querySelector('#mrf'),'refund','Devolver USDT al vendedor','Confirmas que el pago del comprador no es real. La orden se cancela.')}))}

/* Visitas: una llamada por sesión, con un identificador anónimo por dispositivo */
(()=>{try{if(sessionStorage.getItem('_tv'))return;sessionStorage.setItem('_tv','1');let v=localStorage.getItem('_vid');if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/-/g,'');localStorage.setItem('_vid',v)}sb.rpc('track_visit',{p_vid:v}).then(()=>{},()=>{})}catch(e){}})();
/* ---------- Botones siempre vivos ---------- */
/* 1) Sabemos cuándo el dedo está sobre la pantalla para no redibujar justo debajo */
let PRESS=0;
const pressing=()=>PRESS>0&&Date.now()-PRESS<2500;
const idle=async()=>{for(let i=0;i<20&&pressing();i++)await sleep(100)};
/* 2) Red de seguridad: si una actualización cambió el botón entre que lo tocas y lo sueltas,
      el navegador pierde el toque. Aquí lo recuperamos y pulsamos el botón nuevo. */
(()=>{
  const SEL='button,a[href],[role=button],summary,.chip,.tile,.qb,[data-o],[data-mv],[data-m]';
  const sig=el=>el?[el.tagName,el.id,el.className,JSON.stringify(el.dataset||{}),(el.textContent||'').trim().slice(0,40)].join('|'):'';
  let down=null;
  const start=e=>{PRESS=Date.now();const el=e.target&&e.target.closest?e.target.closest(SEL):null;
    down=el?{el,sig:sig(el),x:e.clientX,y:e.clientY,t:Date.now()}:null};
  const end=e=>{PRESS=0;const d=down;down=null;if(!d||e.type==='pointercancel')return;
    const x=e.clientX,y=e.clientY;
    setTimeout(()=>{
      if(d.el.isConnected)return;
      if(Date.now()-d.t>1500||Math.hypot(x-d.x,y-d.y)>12)return;
      const n=document.elementFromPoint(x,y),b=n&&n.closest?n.closest(SEL):null;
      if(b&&!b.disabled&&sig(b)===d.sig)b.click()},40)};
  addEventListener('pointerdown',start,true);addEventListener('pointerup',end,true);addEventListener('pointercancel',end,true);
})();
/* 3) Si una pantalla falla por un error de programación justo al abrirla (y se queda a medias, con botones muertos),
      se vuelve a cargar sola una vez. */
addEventListener('unhandledrejection',e=>{
  const r=e.reason;if(!(r instanceof TypeError||r instanceof ReferenceError))return;
  if(!S.user||document.querySelector('.auth'))return;
  const now=Date.now();if(now-(S._navT||0)>8000||now-(S._healT||0)<30000)return;S._healT=now;
  console.warn('Pantalla incompleta, se recarga:',r&&r.message);toast('Actualizando la pantalla…');go(S.view)});

try{if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
/* Login: al enfocar un campo, sube la pantalla para que el teclado no lo tape */
(()=>{const B=document.body,vv=window.visualViewport;let t=null;
  const kbh=()=>vv?Math.max(0,Math.round(innerHeight-vv.height-vv.offsetTop)):0;
  const isF=e=>e&&e.matches&&e.matches('.auth input,.auth select,.auth textarea');
  const show=el=>{if(!el||!el.isConnected)return;const h=kbh();
    B.classList.add('akb');B.style.setProperty('--akh',(h>80?h+24:Math.round(innerHeight*.45))+'px');
    requestAnimationFrame(()=>{try{el.scrollIntoView({block:'center',behavior:'auto'})}catch(e){}})};
  document.addEventListener('focusin',e=>{if(!isF(e.target))return;clearTimeout(t);
    show(e.target);setTimeout(()=>show(e.target),250);setTimeout(()=>show(e.target),600)});
  document.addEventListener('focusout',()=>{clearTimeout(t);t=setTimeout(()=>{if(!isF(document.activeElement)){B.classList.remove('akb');B.style.removeProperty('--akh')}},200)});
  if(vv)vv.addEventListener('resize',()=>{const a=document.activeElement;if(isF(a))show(a)})})();

boot();
</script>

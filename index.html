async function netFetch(url,opt={}){

  if(btn){if(btn.dataset.busy==='1')return;btn.dataset.busy='1';btn.disabled=true}
  try{await fn();if(okMsg)toast(okMsg,'good')}catch(e){toast(friendly(e),'err')}
  finally{if(btn){btn.dataset.busy='';if(btn.isConnected)btn.disabled=false}}}

function modal(html){
  const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="md">${html}</div>`;

function ask(title,body,ok='Confirmar',cls=''){
  return new Promise(res=>{
    const m=modal(`<h3>${title}</h3>${body}<div class="grid2" style="margin-top:12px"><button class="b gh" id="mn">Cancelar</button><button class="b ${cls}" id="my">${ok}</button></div>`);
    m.onclick=e=>{if(e.target===m){m.remove();res(null)}};
    m.querySelector('#mn').onclick=()=>{m.remove();res(null)};
    m.querySelector('#my').onclick=()=>res(m)})}

  const adm=(id,fn,q,msg,cls)=>{if($(id))$(id).onclick=async ev=>{const m=await ask('Confirmar',`<p>${q}</p>`,'Confirmar',cls);if(!m)return;m.remove();act(ev.target,async()=>{await rpc(fn,{p_order:o.id});await reload()},msg)}};

  let last=o.status+o.updated_at;

const rcRows=x=>[...x.rows,['Estado',x.s],['Fecha',when(x.at)],['Referencia',String(x.id).slice(0,8).toUpperCase()]];
const rcText=x=>`🧾 Comprobante · ${APP_NAME} P2P\n${x.t}\n\n`+rcRows(x).map(([a,b])=>`${a}: ${b}`).join('\n');
function rcBlob(x){return new Promise(res=>{
  const R=rcRows(x),W=720,H=190+R.length*54,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#090a10';g.fillRect(0,0,W,H);g.fillStyle='#12131c';g.fillRect(24,24,W-48,H-48);
  g.fillStyle='#b6adff';g.font='bold 30px system-ui,sans-serif';g.fillText(APP_NAME+' P2P · Comprobante',48,76);
  g.fillStyle='#eceefb';g.font='bold 28px system-ui,sans-serif';g.fillText(x.t,48,126);
  R.forEach(([a,b],i)=>{const y=186+i*54;g.fillStyle='#8c90a8';g.font='24px system-ui,sans-serif';g.textAlign='left';g.fillText(a,48,y);g.fillStyle='#eceefb';g.textAlign='right';let s=String(b);while(g.measureText(s).width>W-300&&s.length>6)s=s.slice(0,-2);if(s!==String(b))s+='…';g.fillText(s,W-48,y)});
  c.toBlob(res,'image/png')})}
function receipt(x){
  const m=modal(`<h3>🧾 Comprobante</h3><b>${esc(x.t)}</b>${rcRows(x).map(([a,b])=>`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><span class="mut">${esc(a)}</span><span style="word-break:break-all;text-align:right">${esc(b)}</span></div>`).join('')}
   <div class="grid2" style="margin-top:12px"><button class="b" id="rs1">Compartir</button><button class="b gh" id="rs2">Guardar imagen</button></div><button class="b gh w" style="margin-top:8px" id="rs3">Cerrar</button>`);
  m.querySelector('#rs3').onclick=()=>m.remove();
  m.querySelector('#rs1').onclick=async()=>{try{const b=await rcBlob(x),f=new File([b],'comprobante.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:rcText(x)});else if(navigator.share)await navigator.share({text:rcText(x)});else copy(rcText(x))}catch(e){if(!e||e.name!=='AbortError')copy(rcText(x))}};
  m.querySelector('#rs2').onclick=async()=>{const b=await rcBlob(x),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='comprobante-'+String(x.id).slice(0,8)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}}

async function viewCalc(){
  const my=NAV;main().innerHTML=hd('Calculadora')+skel(2);bk();
  const[a,o,f]=await Promise.all([sb.from('ads').select('side,asset,quote,price').eq('status','open'),sb.from('offers').select('price_cup,methods').eq('status','open'),sb.from('fx_offers').select('price_cup').eq('status','open')]);
  if(my!==NAV)return;
  const R=[];(a.data||[]).forEach(x=>R.push({asset:x.asset,quote:x.quote,side:x.side,price:+x.price}));
  const qm={'CUP':'CUP','Saldo CUP':'CUP','Saldo Clásica':'USD'};
  (o.data||[]).forEach(x=>{const c=qm[parseM(x.methods).c];if(c)R.push({asset:'USDT',quote:c,side:'sell',price:+x.price_cup})});
  (f.data||[]).forEach(x=>R.push({asset:'USD',quote:'CUP',side:'sell',price:+x.price_cup}));
  const best=(F,T)=>{let r=null,r2=null;
    R.filter(x=>x.side==='buy'&&x.asset===F&&x.quote===T&&x.price>0).forEach(x=>{if(r===null||x.price>r)r=x.price});
    R.filter(x=>x.side==='sell'&&x.asset===T&&x.quote===F&&x.price>0).forEach(x=>{const v=1/x.price;if(r2===null||v>r2)r2=v});
    return r===null?r2:r2===null?r:Math.max(r,r2)};
  const CS=['USDT','CUP','USD'],lb={USDT:'USDT',CUP:'CUP',USD:'USD (Clásica)'};
  const pairs=[];CS.forEach(F=>CS.forEach(T=>{if(F!==T){const r=best(F,T);if(r!=null)pairs.push([F,T,r])}}));
  main().innerHTML=hd('Calculadora')+`<div class="card"><label>Tengo</label><input id="cx" type="number" step="any" min="0" inputmode="decimal" placeholder="0">
   <div class="grid2"><select id="cf">${CS.map(k=>`<option value="${k}">${lb[k]}</option>`).join('')}</select><select id="ct">${CS.map((k,i)=>`<option value="${k}" ${i===1?'selected':''}>${lb[k]}</option>`).join('')}</select></div>
   <div id="cr" style="margin-top:6px"></div><p class="mut" style="margin-bottom:0">Referencia con las mejores ofertas abiertas ahora mismo. El precio final depende de la oferta que elijas.</p></div>
  <h3>Mejores precios ahora</h3>`+(pairs.length?`<div class="card">${pairs.map(([F,T,r])=>`<div class="row" style="margin-bottom:6px"><span class="mut">1 ${lb[F]}</span><b>${n(r,r<1?6:2)} ${T==='USD'?'USD':T}</b></div>`).join('')}</div>`:'<div class="card mut">Todavía no hay ofertas abiertas para calcular.</div>');

/* ---------- Admin: expedientes KYC por usuario (ver y compartir) ---------- */
const KST={approved:['Aprobado','ok'],pending:['Pendiente','warn'],rejected:['Rechazado','bad']};
const KDOCS=[['doc_front','Frente','frente'],['doc_back','Reverso','reverso'],['selfie','Selfie con carnet','selfie']];
const kycUrls=(x,secs)=>Promise.all(KDOCS.map(async([k])=>x[k]?((await sb.storage.from('kyc').createSignedUrl(x[k],secs)).data?.signedUrl||null):null));
async function kycFiles(x){
  const u=await kycUrls(x,300),nm=(x.full_name||x.profiles?.username||'usuario').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase(),out=[];
  for(let i=0;i<KDOCS.length;i++){if(!u[i])continue;
    const r=await fetch(u[i]);if(!r.ok)throw new Error('No se pudo preparar: '+KDOCS[i][1]);
    const b=await r.blob(),ext=(String(x[KDOCS[i][0]]).split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    out.push(new File([b],`kyc-${nm}-${KDOCS[i][2]}.${ext}`,{type:b.type||'image/jpeg'}))}
  if(!out.length)throw new Error('Este expediente no tiene imágenes');return out}
const kycText=(x,links)=>`🪪 KYC · ${APP_NAME} P2P\nNombre: ${x.full_name||'—'}\nDocumento: ${x.id_number||'—'}\nUsuario: @${x.profiles?.username||'—'}\nEstado: ${(KST[x.status]||[x.status])[0]}\nEnviado: ${when(x.created_at)}`+(links?'\n\n'+KDOCS.map(([,l],i)=>links[i]?`${l}: ${links[i]}`:'').filter(Boolean).join('\n'):'');

function shareKyc(x){
  const m=modal(`<h3>Compartir KYC</h3>
   <div class="warnbox bad">⚠️ Son documentos de identidad. Compártelos solo con quien sea imprescindible (autoridad, banco o parte afectada) y por un canal que controles.</div>
   <b>${esc(x.full_name||'—')}</b> <span class="mut">@${esc(x.profiles?.username||'—')} · ${esc(x.id_number||'')}</span>
   <div class="grid2" style="margin-top:12px"><button class="b" id="ks1" disabled>Preparando…</button><button class="b gh" id="ks3" disabled>Descargar</button></div>
   <label style="margin-top:14px">Enlaces temporales (se vencen solos)</label>
   <select id="ksD"><option value="3600">Duran 1 hora</option><option value="86400" selected>Duran 24 horas</option><option value="604800">Duran 7 días</option></select>
   <button class="b gh w" id="ks2">Generar y copiar enlaces</button>
   <textarea id="ksT" rows="6" readonly style="display:none;margin-top:10px"></textarea>
   <button class="b gh w" style="margin-top:8px" id="ks4">Cerrar</button>`);
  const prep=kycFiles(x),B1=m.querySelector('#ks1'),B3=m.querySelector('#ks3');
  prep.then(()=>{B1.disabled=false;B1.textContent='Compartir fotos';B3.disabled=false}).catch(e=>{B1.textContent='No disponible';toast(friendly(e),'err')});
  m.querySelector('#ks4').onclick=()=>m.remove();
  B1.onclick=async()=>{try{const files=await prep;
    if(navigator.canShare&&navigator.canShare({files}))await navigator.share({files,text:kycText(x)});
    else toast('Este navegador no comparte archivos: usa Descargar o los enlaces temporales','err')}catch(e){if(!e||e.name!=='AbortError')toast(friendly(e),'err')}};
  B3.onclick=async()=>{try{const files=await prep;files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},i*350))}catch(e){toast(friendly(e),'err')}};
  m.querySelector('#ks2').onclick=ev=>act(ev.target,async()=>{
    const u=await kycUrls(x,+m.querySelector('#ksD').value),t=kycText(x,u),ta=m.querySelector('#ksT');
    ta.value=t;ta.style.display='block';ta.select();
    try{await navigator.clipboard.writeText(t);toast('Enlaces copiados','good')}catch(e){toast('Copia el texto de abajo manualmente','')}})}

  main().insertAdjacentHTML('beforeend',`<h3 id="s-kyc">Verificaciones KYC pendientes</h3>`+((ks.data||[]).length?ks.data.map(x=>`<div class="card"><div class="row"><b>${esc(x.full_name)}</b><span class="mut">@${esc(x.profiles?.username)}</span></div><div class="mut">Documento: ${esc(x.id_number)} · ${when(x.created_at)}</div><button class="b gh sm" data-kv="${x.id}" style="margin-top:6px">Ver documentos</button><div class="grid2" style="margin-top:8px"><button class="b ok sm" data-ka="${x.id}">Aprobar</button><button class="b bad sm" data-kr="${x.id}">Rechazar</button></div></div>`).join(''):'<div class="card mut">Ninguna.</div>')+`<h3 id="s-top">Recargas de saldo pendientes</h3>`+((ct.data||[]).length?ct.data.map(x=>`<div class="card"><div class="row"><b>${n(x.amount,x.currency==='USD'?2:0)} ${esc(x.currency)}</b><span class="mut">@${esc(x.profiles?.username)}</span></div><button class="b gh sm" data-pv="${esc(x.proof_path)}" style="margin-top:6px">Ver captura</button><div class="grid2" style="margin-top:8px"><button class="b ok sm" data-ca="${x.id}">Acreditar</button><button class="b bad sm" data-cr="${x.id}">Rechazar</button></div></div>`).join(''):'<div class="card mut">Ninguna.</div>')+`<h3>Retiros de saldo pendientes</h3>`+((cw.data||[]).length?cw.data.map(x=>`<div class="card"><div class="row"><b>${n(x.amount,x.currency==='USD'?2:0)} ${esc(x.currency)}</b><span class="mut">@${esc(x.profiles?.username)}</span></div><div class="row"><code>${esc(x.card)}</code>${cpBtn(x.card)}</div><div class="warnbox" style="margin:6px 0">Enviar <b>${n(netOf(x),x.currency==='USD'?2:0)} ${esc(x.currency)}</b> (comisión ${n(x.amount-netOf(x),x.currency==='USD'?2:0)})</div><div class="grid2" style="margin-top:8px"><button class="b ok sm" data-cd="${x.id}">Marcar enviado</button><button class="b bad sm" data-cx="${x.id}">Rechazar</button></div></div>`).join(''):'<div class="card mut">Ninguno.</div>'));
  adminBlocks();
  adminKycUsers();
  {const fb=$('feeClr');if(fb)fb.onclick=async()=>{
    const m=await ask('Poner comisiones en 0',`<p>Confirma que ya tomaste este dinero:</p><p><b>${Object.entries(ftot).filter(([,v])=>v>0).map(([c,v])=>n(v,fd(c))+' '+esc(c)).join(' · ')}</b></p><p class="mut">El historial de comisiones no se borra: solo se registra el retiro y el contador queda en 0. Las comisiones nuevas vuelven a sumar desde cero.</p>`,'Sí, poner en 0','ok');
    if(!m)return;m.remove();
    act(fb,async()=>{await rpc('admin_clear_fees');viewAdmin()},'Comisiones en 0')}}
  main().querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>$(b.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'}));
  main().querySelectorAll('[data-tp]').forEach(b=>b.onclick=async()=>{const[id,w]=b.dataset.tp.split('|'),t=TM.find(x=>x.id===id),p=w==='s'?t.sender_proof:t.receiver_proof;
    if(!p)return toast('Aún no hay captura','err');const{data}=await sb.storage.from('proofs').createSignedUrl(p,600);data?zoom(data.signedUrl):toast('No se pudo cargar la captura','err')});
  main().querySelectorAll('[data-tl]').forEach(b=>b.onclick=async()=>{const m=await ask('Aprobar y liberar','<p>Se liberará el CUP retenido al vendedor (menos la comisión). No se puede deshacer.</p>','Aprobar','ok');if(!m)return;m.remove();
    act(b,async()=>{await rpc('admin_release_trade',{p_id:b.dataset.tl});viewAdmin()},'Operación liberada')});
  main().querySelectorAll('[data-tf]').forEach(b=>b.onclick=async()=>{const m=await ask('Rechazar y devolver','<p>El CUP retenido vuelve al comprador.</p>','Rechazar','bad');if(!m)return;m.remove();
    act(b,async()=>{await rpc('admin_refund_trade',{p_id:b.dataset.tf});viewAdmin()},'Operación devuelta')});
  main().querySelectorAll('[data-kv]').forEach(b=>b.onclick=async()=>{
    const x=ks.data.find(k=>k.id===b.dataset.kv);
    const u=await Promise.all([x.doc_front,x.doc_back,x.selfie].map(async p=>(await sb.storage.from('kyc').createSignedUrl(p,600)).data?.signedUrl));
    modal(`<h3>${esc(x.full_name)} · ${esc(x.id_number)}</h3>`+['Frente','Reverso','Selfie con carnet'].map((l,i)=>`<p class="mut">${l}</p>${u[i]?`<img src="${u[i]}" alt="${l}">`:'<p class="mut">No se pudo cargar</p>'}`).join('')+`<button class="b gh w" style="margin-top:10px" onclick="this.closest('.ov').remove()">Cerrar</button>`)});
  main().querySelectorAll('[data-ka]').forEach(b=>b.onclick=async()=>{const m=await ask('Aprobar verificación','<p>¿Los documentos son claros y coinciden con la selfie?</p>','Aprobar','ok');if(!m)return;m.remove();
    act(b,async()=>{await rpc('admin_review_kyc',{p_id:b.dataset.ka,p_ok:true,p_note:''});viewAdmin()},'Usuario verificado')});
  main().querySelectorAll('[data-kr]').forEach(b=>b.onclick=async()=>{const m=await ask('Rechazar verificación','<label>Motivo (el usuario lo verá)</label><input id="kmo" placeholder="Ej: la selfie no se ve clara">','Rechazar','bad');if(!m)return;const nt=m.querySelector('#kmo').value.trim();m.remove();
    act(b,async()=>{await rpc('admin_review_kyc',{p_id:b.dataset.kr,p_ok:false,p_note:nt||'Documentos no válidos'});viewAdmin()},'Verificación rechazada')});
  main().querySelectorAll('[data-pv]').forEach(b=>b.onclick=async()=>{const{data}=await sb.storage.from('proofs').createSignedUrl(b.dataset.pv,3600);data?zoom(data.signedUrl):toast('No se pudo cargar la captura','err')});
  main().querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>go('order',el.dataset.o));
  const bind=(attr,fn,okMsg)=>main().querySelectorAll(`[${attr}]`).forEach(b=>b.onclick=async()=>{
    const m=await ask('Confirmar','<p>¿Seguro? Esta acción no se puede deshacer.</p>');if(!m)return;m.remove();
    act(b,async()=>{await rpc(fn,{p_id:b.getAttribute(attr)});viewAdmin()},okMsg)});
  bind('data-da','admin_approve_deposit','Saldo acreditado');
  bind('data-dr','admin_reject_deposit','Depósito rechazado');
  bind('data-wd','admin_complete_withdrawal','Retiro marcado como enviado');
  bind('data-wr','admin_reject_withdrawal','Retiro rechazado y saldo devuelto');
  bind('data-ca','admin_approve_fiat_topup','Saldo acreditado');
  bind('data-cr','admin_reject_fiat_topup','Recarga rechazada');
  bind('data-cd','admin_complete_fiat_withdrawal','Retiro marcado como enviado');
  bind('data-cx','admin_reject_fiat_withdrawal','Retiro rechazado y saldo devuelto');
  await adminExtras(an,ai,rr)}

boot();
</script>
</body>
</html>

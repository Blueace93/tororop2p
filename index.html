  if(my!==NAV)return;
  const TM=tm.data||[],tn={};
  if(TM.length){const{data:pp}=await sb.from('profiles').select('id,username').in('id',[...new Set(TM.flatMap(t=>[t.buyer_id,t.seller_id]))]);(pp||[]).forEach(p=>tn[p.id]=p.username)}
  const movilHtml=`<h3 id="s-movil">Saldo móvil por revisar</h3>`+(TM.length?TM.map(t=>`<div class="card ${t.status==='review'?'hl':''}"><div class="row"><b>${n(t.amount,2)} saldo móvil · ${n(t.total,qd(t.quote))} ${esc(t.quote)}</b><span class="tag warn">${t.status==='review'?'Mediación pedida':'Esperando fotos'}</span></div><div class="mut">Envía: @${esc(tn[t.seller_id])} → Recibe: @${esc(tn[t.buyer_id])} · Número: <code>${esc(t.phone)}</code></div><div class="mut">Retenido: ${n(t.escrow,qd(t.quote))} ${esc(t.quote)} · Comisión: ${n(t.fee,qd(t.fee_cur))} ${esc(t.fee_cur)} (se descuenta al vendedor)</div><div class="grid2" style="margin-top:8px"><button class="b gh sm" data-tp="${t.id}|s">${t.sender_proof?'Ver foto del envío':'Sin foto del envío'}</button><button class="b gh sm" data-tp="${t.id}|b">${t.receiver_proof?'Ver foto de recepción':'Sin foto de recepción'}</button></div><div class="grid2" style="margin-top:8px"><button class="b ok sm" data-tl="${t.id}">Aprobar y liberar</button><button class="b bad sm" data-tf="${t.id}">Rechazar y devolver</button></div></div>`).join(''):'<div class="card mut">Ninguna.</div>');
  const KL={cambio_usd:'Cambio USD ⇄ CUP',retiro_usdt:'Retiro de USDT',retiro_cup:'Retiro de saldo CUP',retiro_usd:'Retiro de Saldo Clásica',compra_usdt:'Compra de USDT',mercado_usdt:'Mercado · USDT',mercado_usd:'Mercado · USD Clásica',mercado_movil:'Mercado · Saldo móvil'};
  const FL=fl.data||[],ftot={};FL.forEach(x=>{ftot[x.currency]=(ftot[x.currency]||0)+Number(x.amount)});
  const fd=c=>c==='CUP'?0:c==='USD'?2:4;
  const feeHtml=`<h3>Comisiones cobradas</h3><div class="card hl">${Object.keys(ftot).length?`<div class="wts">${Object.entries(ftot).map(([c,v])=>wtile('Total',v,c,fd(c))).join('')}</div>`:'<span class="mut">Todavía no hay comisiones registradas.</span>'}${FL.slice(0,30).map(x=>`<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><b>${n(x.amount,fd(x.currency))} ${esc(x.currency)}</b> · ${esc(KL[x.kind]||x.kind)}<br><span class="mut">Cobrada a @${esc(x.profiles?.username||'?')} · ${when(x.created_at)}</span></div>`).join('')}${fl.error?'<p class="mut">Falta ejecutar registro_comisiones.sql en Supabase.</p>':''}</div>`;
  const prio={disputed:0,seller_confirmed:1,payment_sent:2,awaiting_payment:3};
  const orders=(o.data||[]).sort((a,b)=>prio[a.status]-prio[b.status]);
  const nd=orders.filter(x=>x.status==='disputed').length;
  const tl=(ic,lb,c,id)=>`<button class="tile ${c?'hot':''}" data-go="${id}"><span class="tc">${c}</span><span>${ic} ${lb}</span></button>`;
  const tiles=`<div class="tiles">${tl('📱','Saldo móvil',TM.length,'s-movil')}${tl('🪪','KYC',(ks.data||[]).length,'s-kyc')}${tl('💰','Recargas',(ct.data||[]).length,'s-top')}${tl('💸','Retiros',(w.data||[]).length+(cw.data||[]).length,'s-wd')}${tl('📥','Depósitos USDT',(d.data||[]).length,'s-dep')}${tl('🛒','Operaciones',orders.length,'s-ord')}</div>`;
  main().innerHTML=`<h2>Panel de administrador</h2>
  ${tiles}
  <div class="grid2" style="margin-bottom:12px"><div class="card" style="margin:0"><div class="mut">Disputas abiertas</div><div class="big" style="color:${nd?'var(--bad)':'var(--ok)'}">${nd}</div></div>
  <div class="card" style="margin:0"><div class="mut">Depósitos / retiros</div><div class="big">${(d.data||[]).length} / ${(w.data||[]).length}</div></div></div>
  ${movilHtml}${feeHtml}<h3 id="s-ord">Operaciones por revisar</h3>`+(orders.length?orders.map(x=>{const[t,c]=STATUS[x.status];
    return`<div class="card ${x.status==='disputed'?'dg':''}" style="cursor:pointer" data-o="${x.id}"><div class="row"><b>${n(x.amount,2)} USDT · ${mny(due(x,parseM(x.methods).c),parseM(x.methods).c)} ${esc(parseM(x.methods).c)}</b><span class="tag ${c}">${t}</span></div><div class="mut">${when(x.created_at)}</div></div>`}).join(''):'<div class="card mut">Nada pendiente.</div>')+
  `<h3 id="s-dep">Depósitos pendientes</h3>`+((d.data||[]).length?d.data.map(x=>`<div class="card"><div class="row"><b>${n(x.amount,2)} USDT</b><span class="mut">@${esc(x.profiles?.username)}</span></div>
    <div class="mut">TxID: ${esc(x.txid||'—')}</div><div class="grid2" style="margin-top:8px"><button class="b ok sm" data-da="${x.id}">Acreditar</button><button class="b bad sm" data-dr="${x.id}">Rechazar</button></div></div>`).join(''):'<div class="card mut">Ninguno.</div>')+
  `<h3 id="s-wd">Retiros pendientes</h3>`+((w.data||[]).length?w.data.map(x=>`<div class="card"><div class="row"><b>${n(x.amount,2)} USDT</b><span class="mut">@${esc(x.profiles?.username)}</span></div>
    <div class="row"><span class="mut">${esc(x.network)} · <code>${esc(x.address)}</code></span>${cpBtn(x.address)}</div>
    <div class="warnbox" style="margin:6px 0">Enviar <b>${n(netOf(x),4)} USDT</b> (comisión ${n(x.amount-netOf(x),4)}). Luego pulsa “Marcar enviado”.</div>
    <div class="grid2" style="margin-top:8px"><button class="b ok sm" data-wd="${x.id}">Marcar enviado</button><button class="b bad sm" data-wr="${x.id}">Rechazar</button></div></div>`).join(''):'<div class="card mut">Ninguno.</div>');
  main().insertAdjacentHTML('beforeend',`<h3 id="s-kyc">Verificaciones KYC pendientes</h3>`+((ks.data||[]).length?ks.data.map(x=>`<div class="card"><div class="row"><b>${esc(x.full_name)}</b><span class="mut">@${esc(x.profiles?.username)}</span></div><div class="mut">Documento: ${esc(x.id_number)} · ${when(x.created_at)}</div><button class="b gh sm" data-kv="${x.id}" style="margin-top:6px">Ver documentos</button><div class="grid2" style="margin-top:8px"><button class="b ok sm" data-ka="${x.id}">Aprobar</button><button class="b bad sm" data-kr="${x.id}">Rechazar</button></div></div>`).join(''):'<div class="card mut">Ninguna.</div>')+`<h3 id="s-top">Recargas de saldo pendientes</h3>`+((ct.data||[]).length?ct.data.map(x=>`<div class="card"><div class="row"><b>${n(x.amount,x.currency==='USD'?2:0)} ${esc(x.currency)}</b><span class="mut">@${esc(x.profiles?.username)}</span></div><button class="b gh sm" data-pv="${esc(x.proof_path)}" style="margin-top:6px">Ver captura</button><div class="grid2" style="margin-top:8px"><button class="b ok sm" data-ca="${x.id}">Acreditar</button><button class="b bad sm" data-cr="${x.id}">Rechazar</button></div></div>`).join(''):'<div class="card mut">Ninguna.</div>')+`<h3>Retiros de saldo pendientes</h3>`+((cw.data||[]).length?cw.data.map(x=>`<div class="card"><div class="row"><b>${n(x.amount,x.currency==='USD'?2:0)} ${esc(x.currency)}</b><span class="mut">@${esc(x.profiles?.username)}</span></div><div class="row"><code>${esc(x.card)}</code>${cpBtn(x.card)}</div><div class="warnbox" style="margin:6px 0">Enviar <b>${n(netOf(x),x.currency==='USD'?2:0)} ${esc(x.currency)}</b> (comisión ${n(x.amount-netOf(x),x.currency==='USD'?2:0)})</div><div class="grid2" style="margin-top:8px"><button class="b ok sm" data-cd="${x.id}">Marcar enviado</button><button class="b bad sm" data-cx="${x.id}">Rechazar</button></div></div>`).join(''):'<div class="card mut">Ninguno.</div>'));
  main().querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>$(b.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'}));
  main().querySelectorAll('[data-tp]').forEach(b=>b.onclick=async()=>{const[id,w]=b.dataset.tp.split('|'),t=TM.find(x=>x.id===id),p=w==='s'?t.sender_proof:t.receiver_proof;
    if(!p)return toast('Aún no hay captura','err');const{data}=await sb.storage.from('proofs').createSignedUrl(p,600);data?zoom(data.signedUrl):toast('No se pudo cargar la captura','err')});
  main().querySelectorAll('[data-tl]').forEach(b=>b.onclick=async()=>{const m=await ask('Aprobar y liberar','<p>Se liberará el CUP retenido al vendedor (menos la comisión). No se puede deshacer.</p>','Aprobar','ok');if(!m)return;m.remove();
    act(b,async()=>{await rpc('admin_release_trade',{p_id:b.dataset.tl});viewAdmin()},'Operación liberada')});
  main().querySelectorAll('[data-tf]').forEach(b=>b.onclick=async()=>{const m=await ask('Rechazar y devolver','<p>El CUP retenido vuelve al comprador.</p>','Rechazar','bad');if(!m)return;m.remove();
    act(b,async()=>{await rpc('admin_refund_trade',{p_id:b.dataset.tf});viewAdmin()},'Operación devuelta')});
  main().querySelectorAll('[data-kv]').forEach(b=>b.onclick=async()=>{
    const x=ks.data.find(k=>k.id===b.dataset.kv);
    const u=await Promise.all([x.doc_front,x.doc_back,x.selfie].map(async p=>(await sb.storage.from('kyc').createSignedUrl(p,600)).data?.signedUrl));
    modal(`<h3>${esc(x.full_name)} · ${esc(x.id_number)}</h3>`+['Frente','Reverso','Selfie con carnet'].map((l,i)=>`<p class="mut">${l}</p>${u[i]?`<img src="${u[i]}" alt="${l}">`:'<p class="mut">No se pudo cargar</p>'}`).join('')+`<button class="b gh w" style="margin-top:10px" onclick="this.closest('.ov').remove()">Cerrar</button>`)});
  main().querySelectorAll('[data-ka]').forEach(b=>b.onclick=async()=>{const m=await ask('Aprobar verificación','<p>¿Los documentos son claros y coinciden con la selfie?</p>','Aprobar','ok');if(!m)return;m.remove();
    act(b,async()=>{await rpc('admin_review_kyc',{p_id:b.dataset.ka,p_ok:true,p_note:''});viewAdmin()},'Usuario verificado')});
  main().querySelectorAll('[data-kr]').forEach(b=>b.onclick=async()=>{const m=await ask('Rechazar verificación','<label>Motivo (el usuario lo verá)</label><input id="kmo" placeholder="Ej: la selfie no se ve clara">','Rechazar','bad');if(!m)return;const nt=m.querySelector('#kmo').value.trim();m.remove();
    act(b,async()=>{await rpc('admin_review_kyc',{p_id:b.dataset.kr,p_ok:false,p_note:nt||'Documentos no válidos'});viewAdmin()},'Verificación rechazada')});
  main().querySelectorAll('[data-pv]').forEach(b=>b.onclick=async()=>{const{data}=await sb.storage.from('proofs').createSignedUrl(b.dataset.pv,3600);data?zoom(data.signedUrl):toast('No se pudo cargar la captura','err')});
  main().querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>go('order',el.dataset.o));
  const bind=(attr,fn,okMsg)=>main().querySelectorAll(`[${attr}]`).forEach(b=>b.onclick=async()=>{
    const m=await ask('Confirmar','<p>¿Seguro? Esta acción no se puede deshacer.</p>');if(!m)return;m.remove();
    act(b,async()=>{await rpc(fn,{p_id:b.getAttribute(attr)});viewAdmin()},okMsg)});
  bind('data-da','admin_approve_deposit','Saldo acreditado');
  bind('data-dr','admin_reject_deposit','Depósito rechazado');
  bind('data-wd','admin_complete_withdrawal','Retiro marcado como enviado');
  bind('data-wr','admin_reject_withdrawal','Retiro rechazado y saldo devuelto');
  bind('data-ca','admin_approve_fiat_topup','Saldo acreditado');
  bind('data-cr','admin_reject_fiat_topup','Recarga rechazada');
  bind('data-cd','admin_complete_fiat_withdrawal','Retiro marcado como enviado');
  bind('data-cx','admin_reject_fiat_withdrawal','Retiro rechazado y saldo devuelto')}

boot();
</script>
</body>
</html>

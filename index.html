  const ms=read?15000:(String(url).includes('/storage/')?120000:30000);let last;
  for(let i=0;i<tries;i++){
    if(!navigator.onLine&&i===0)await Promise.race([new Promise(r=>addEventListener('online',r,{once:true})),sleep(6000)]);
    const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
    if(opt.signal){if(opt.signal.aborted)c.abort();else opt.signal.addEventListener('abort',()=>c.abort(),{once:true})}
    try{const r=await fetch(url,{...opt,signal:c.signal});clearTimeout(t);if(read&&r.status>=500&&i<tries-1){await sleep(500*(i+1));continue}return r}
    catch(e){clearTimeout(t);last=e;if(opt.signal&&opt.signal.aborted)throw e;if(i<tries-1)await sleep(600*(i+1))}}
  throw last}

function rcBlob(x){return new Promise(res=>{
  const R=rcRows(x),W=720,H=190+R.length*54,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');

async function proofImg(path,who){

async function uploadProof(orderId,role,file){
  if(!file)throw new Error('Elige una imagen');
  if(!/^image\//.test(file.type))throw new Error('El archivo debe ser una imagen');
  if(file.size>6*1024*1024)throw new Error('La imagen pesa más de 6 MB');
  file=await shrinkImg(file);
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`${orderId}/${role}-${Date.now()}.${ext}`;
  const{error}=await sb.storage.from('proofs').upload(path,file,{contentType:file.type});
  if(error)throw new Error(friendly(error));return path}

    sb.from('fiat_topups').select('id,currency,amount,proof_path,created_at,profiles(username)').eq('status','pending').order('created_at'),
    sb.from('fiat_withdrawals').select('*,profiles(username)').eq('status','pending').order('created_at'),
    sb.from('kyc_submissions').select('id',{count:'exact',head:true}).eq('status','pending')]);
  if(my!==NAV)return;
  main().innerHTML=`<h2>Panel de administrador</h2>
  <div class="card"><h3>Pendientes</h3><p class="mut">Operaciones: ${(o.data||[]).length} · Retiros: ${(w.data||[]).length} · KYC: ${ks.count||0}</p></div>`;
}

function renderOffline(){
  S.offScreen=1;
  $app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"><div style="max-width:380px">${brand(34)}<div style="font-size:44px;margin:18px 0 6px">📡</div><h2 style="margin:0 0 8px">Sin conexión</h2><p class="mut">Tororo necesita internet para mostrar tus saldos y operaciones. Esta pantalla se actualiza sola cuando vuelva la conexión.</p><button class="b" id="offr">Reintentar</button></div></div>`;
  $('offr').onclick=()=>{if(navigator.onLine)boot();else toast('Todavía no hay internet','err')}}
addEventListener('online',()=>{if(S.offScreen){S.offScreen=0;boot()}});

const OBX={
  key(){return'obx_'+(S.user?S.user.id:'')},
  get(){try{return JSON.parse(lsGet(this.key())||'[]')}catch(e){return[]}},
  set(a){lsSet(this.key(),JSON.stringify(a))},
  add(it){const a=this.get();if(a.length>=30)throw new Error('Hay demasiadas acciones pendientes.');a.push({...it,id:Date.now()+'-'+Math.random().toString(36).slice(2,7)});this.set(a)},
  async flush(){
    if(this.busy||!S.user||!navigator.onLine)return;
    if(!this.get().length)return;
    this.busy=true;let ok=0,bad=0;
    try{
      for(const it of this.get()){
        try{
          let r=null;
          if(it.t==='chat')r=await sb.from('order_messages').insert({order_id:it.order_id,sender_id:S.user.id,body:it.body});
          else if(it.t==='alert')r=await sb.from('price_alerts').insert({asset:it.asset,quote:it.quote,direction:it.direction,target:it.target});
          if(r&&r.error)throw r.error;
          ok++
        }catch(e){
          if(/fetch|network|abort|timed? ?out|load failed/i.test(String((e&&e.message)||e)))break;
          bad++
        }
        this.set(this.get().filter(x=>x.id!==it.id))
      }
    }finally{this.busy=false}
    if(ok)toast(ok===1?'Se envió 1 acción guardada sin conexión':'Se enviaron '+ok+' acciones guardadas sin conexión','good');
    if(bad)toast(bad+' acción(es) guardada(s) no se pudieron enviar','err');
    if(ok&&(S.view==='order'||S.view==='alerts'))go(S.view)}};
addEventListener('online',()=>setTimeout(()=>OBX.flush(),1500));

boot();
</script>
